name: Kaufkraft-Check Fotos

# Holt echte Produktfotos fuer @kaufkraft.check (Pexels, sonst Openverse) und
# legt eine Uebersicht aller Fotos an: assets/kaufkraft_products/_uebersicht.jpg
#
# Ablauf:
#   1. "Run workflow" ohne Eingabe -> holt alle fehlenden Fotos + Uebersicht
#   2. Uebersicht auf GitHub ansehen
#   3. Unpassende Fotos neu holen: "Run workflow" mit z.B. "butter,kino"
#      (oder ein eigenes Foto als assets/kaufkraft_products/<id>.jpg hochladen)
#
# Secret PEXELS_API_KEY: kostenlos unter https://www.pexels.com/api/ (deutlich
# bessere Treffer als Openverse). Ohne Secret wird nur Openverse genutzt.

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Optional: Produkt-IDs neu holen, kommagetrennt (z.B. butter,kino)"
        default: ""

permissions:
  contents: write

concurrency:
  group: kaufkraft-post
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Fotos holen + Uebersicht bauen
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.redo }}" ]; then
            python scripts/kaufkraft_photos.py --redo "${{ github.event.inputs.redo }}"
          else
            python scripts/kaufkraft_photos.py
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/kaufkraft_products
          git commit -m "Kaufkraft-Fotos: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "nichts zu committen"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
