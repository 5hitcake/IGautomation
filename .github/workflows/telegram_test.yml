name: Telegram test (temporaer)

on:
  push:
    branches: [ccr-178c7728-27xf6u]
    paths: [".github/workflows/telegram_test.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests Pillow
      - name: Freigabe-Test (postet NICHT auf Instagram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p assets/people_profile
          cd scripts && python3 - <<'PY' 2>&1 | tee ../assets/people_profile/telegram_test.txt
          import os, random, sys
          from datetime import datetime, timedelta, timezone
          import people_generate as pg, people_review as pr
          t, c = os.environ["TELEGRAM_BOT_TOKEN"].strip(), os.environ["TELEGRAM_CHAT_ID"].strip()
          print(f"token length {len(t)}, chat id length {len(c)}, chat id numeric {c.lstrip('-').isdigit()}")
          tg = pr.Telegram(t, c)
          me = tg.call("getMe")
          print(f"Bot: @{me['username']}")
          tg.send_text("🧪 TEST - nichts davon wird auf Instagram gepostet. Gleich kommt ein Testbild mit Knöpfen. Bitte einen davon drücken (10 Minuten Zeit).")
          img = open("../assets/people_profile/woman.webp", "rb").read()
          def fake_candidate(state, dry_run=False):
              p = pg.roll_persona({"recent": []})
              return {"number": 1, "model": "TEST", "jpeg": pg.to_instagram_jpeg(img), "persona": p,
                      "prompt": "test", "caption": "🧪 TEST\n\n" + pg.build_caption(p, 1)}
          pg.create_candidate = fake_candidate
          deadline = datetime.now(timezone.utc) + timedelta(minutes=10)
          cand = pr.review(tg, {}, deadline, sleep=lambda s: print(f"(Test: wuerde jetzt {int(s)}s bis zum Termin warten)"))
          result = "FREIGEGEBEN (oder keine Antwort)" if cand else "VERWORFEN"
          print("Ergebnis:", result)
          tg.send_text(f"🧪 Test beendet. Ergebnis: {result}. Es wurde nichts gepostet.")
          PY
      - name: Commit Ergebnis
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/people_profile/telegram_test.txt
          git commit -m "Telegram-Test: Ergebnis" && git push
