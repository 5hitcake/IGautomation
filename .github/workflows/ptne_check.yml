name: PTNE secrets check (temporaer)

on:
  push:
    branches: [ccr-178c7728-27xf6u]
    paths: [".github/workflows/ptne_check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instagram-Token pruefen (nur lesend, keine Werte ausgeben)
        env:
          T: ${{ secrets.PTNE_API_TOKEN }}
          A: ${{ secrets.PTNE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p assets/people_profile
          python3 - <<'PY' | tee assets/people_profile/ptne_check.txt
          import json, os, urllib.request, urllib.error
          t = os.environ["T"].strip(); a = os.environ["A"].strip()
          print(f"PTNE_API_TOKEN length: {len(t)} / PTNE_ACCOUNT_TOKEN length: {len(a)} / account id numeric: {a.isdigit()}")
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")
          for label, tok in (("API_TOKEN as token", t), ("ACCOUNT_TOKEN as token", a)):
              s, j = get(f"https://graph.instagram.com/v21.0/me?fields=user_id,username,account_type&access_token={tok}")
              if s == 200:
                  print(f"{label}: OK username=@{j.get('username')} type={j.get('account_type')} "
                        f"user_id matches other secret: {j.get('user_id') == (a if tok == t else t)}")
              else:
                  print(f"{label}: HTTP {s} {j.get('error', {}).get('message', '')[:120]}")
          PY
      - name: Commit Ergebnis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/people_profile/ptne_check.txt
          git commit -m "PTNE-Check: Ergebnis" && git push
