name: Kaufkraft-Check Post

# Taeglich ein Post fuer den Instagram-Account @kaufkraft.check:
#   Mo-Sa  Produkt als Reel: Bild + Preis 2001 / 2010 / heute (scripts/kaufkraft_post.py,
#          Video aus scripts/kaufkraft_reel.py, liegt auf dem Branch kaufkraft-media)
#   So     Inflation der Woche (rotiert: Rate, 100-Euro-Kaufkraft, Preistreiber, Europa)
# Daten: Eurostat HVPI (frei, kein Schluessel). Produktbilder (schlichte
# Studiobilder, Cloudflare Workers AI) vorab erzeugen und pruefen mit dem
# Workflow "Kaufkraft-Check Fotos". Gepostet werden zuerst Produkte mit Bild.
#
# Benoetigte Secrets (Settings -> Secrets and variables -> Actions):
#   WOE_ACCOUNT_TOKEN       Long-Lived Access Token des neuen Accounts
#   WOE_ACCOUNT_ID          Instagram-Account-ID des neuen Accounts
# Solange die fehlen, laeuft der Plan nicht; "Run workflow" erzeugt dann nur
# eine Vorschau (wird committet, aber nicht gepostet).

# Posting-Zeiten (deutsche Top-Zeiten): Mo-Fr 18:52, Sa+So 10:52 Uhr.
# Gestartet vom Cloudflare-Zeitgeber cloudflare/people_scheduler (puenktlich, mit
# planned=true); GitHub-Crons kommen oft Stunden zu spaet. Der Cron unten ist nur
# Ersatz am Abend, falls der Zeitgeber ausfaellt (Doppelpost-Schutz im Gate).
on:
  schedule:
    - cron: "37 19 * * *"  # Ersatz: 20:37 Winterzeit / 21:37 Sommerzeit, nur wenn heute noch nichts kam
  workflow_dispatch:
    inputs:
      kind:
        description: "Was soll erzeugt werden?"
        type: choice
        default: auto
        options: [auto, product, inflation]
      product:
        description: "Optional: Produkt-ID (z.B. butter) aus content/kaufkraft_products.json"
        default: ""
      planned:
        description: "Nur fuer den Zeitgeber: true = geplanter Post (max. 1 pro Tag)"
        default: "false"

permissions:
  contents: write

env:
  # Sicherheitscheck: nur posten, wenn der Token zu diesem Account gehoert.
  IG_USERNAME: "kaufkraft.check"

concurrency:
  group: kaufkraft-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Pruefen, ob heute schon gepostet wurde / Secrets da sind
        id: gate
        env:
          HAS_IG: ${{ secrets.WOE_ACCOUNT_TOKEN != '' && secrets.WOE_ACCOUNT_ID != '' }}
        run: |
          echo "publish=$HAS_IG" >> "$GITHUB_OUTPUT"
          # Manuell per "Run workflow": immer laufen. Geplant (Zeitgeber oder Ersatz-Cron):
          # nur mit Secrets und hoechstens einmal pro Tag.
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.planned }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_IG" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WOE_ACCOUNT_TOKEN / WOE_ACCOUNT_ID fehlen - kein Post (siehe README)."
            exit 0
          fi
          # Ersatz-Cron kommt bei GitHub oft Stunden zu spaet. Nach Mitternacht wuerde er sonst
          # mitten in der Nacht den Post des neuen Tages vorwegnehmen -> nur 19-23 Uhr Berlin.
          hour="$(TZ="Europe/Berlin" date +%-H)"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 19 ] || [ "$hour" -gt 23 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ueberspringe: Ersatz-Cron kam zu spaet ($hour Uhr Berlin)."
            exit 0
          fi
          today="$(TZ="Europe/Berlin" date +%Y-%m-%d)"
          if git log --grep="Kaufkraft-Post: $today" --oneline | grep -q .; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ueberspringe: heute ($today) wurde bereits gepostet."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install requests Pillow numpy
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Post erzeugen
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLI_TOKEN: ${{ secrets.POLLI_TOKEN }}
        run: |
          args="--kind ${{ github.event.inputs.kind || 'auto' }}"
          if [ -n "${{ github.event.inputs.product }}" ]; then
            args="$args --product ${{ github.event.inputs.product }}"
          fi
          python scripts/kaufkraft_post.py $args

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/kaufkraft_generated assets/kaufkraft_products kaufkraft_posted_log.json
          if [ "${{ steps.gate.outputs.publish }}" = "true" ]; then
            msg="Kaufkraft-Post: $(TZ="Europe/Berlin" date +%Y-%m-%d)"
          else
            msg="Kaufkraft-Vorschau: $(date -u +'%Y-%m-%d %H:%M') UTC"
          fi
          git commit -m "$msg" || echo "nichts zu committen"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Reel auf den Medien-Branch legen (haelt main klein)
        if: >-
          steps.gate.outputs.run == 'true' && steps.gate.outputs.publish == 'true'
          && hashFiles('assets/kaufkraft_generated/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp assets/kaufkraft_generated/reel_*.mp4 "$tmp/"
          cd "$tmp"
          git init -q -b kaufkraft-media
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Aktuelles Reel"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kaufkraft-media

      - name: Wait for raw.githubusercontent.com propagation
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.publish == 'true'
        run: sleep 20

      - name: Publish to Instagram
        id: publish
        if: >-
          steps.gate.outputs.run == 'true' && steps.gate.outputs.publish == 'true'
          && github.ref == 'refs/heads/main'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.WOE_ACCOUNT_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.WOE_ACCOUNT_ID }}
        run: >-
          python scripts/publish.py
          --post-file assets/kaufkraft_generated/next_post.json
          --expect-username "$IG_USERNAME"

      # TikTok (@kaufkraft.check): dasselbe Reel. Modus "inbox": Video landet als Entwurf in der
      # TikTok-App ("Bearbeiten und posten"), solange die TikTok-App nicht geprueft ist.
      # Benoetigt das Secret KAUFKRAFT_TIKTOK_REFRESH_TOKEN (einmalig mit scripts/tiktok_auth.py).
      - name: Zusaetzlich auf TikTok hochladen
        if: steps.publish.outcome == 'success' && hashFiles('assets/kaufkraft_generated/*.mp4') != ''
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.KAUFKRAFT_TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.KAUFKRAFT_TIKTOK_MODE || 'inbox' }}
          TIKTOK_EXPECT_NAME: ${{ vars.KAUFKRAFT_TIKTOK_NAME || 'Kaufkraft Check' }}
        run: |
          if [ -z "$TIKTOK_CLIENT_KEY" ] || [ -z "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "Kein TikTok-Zugang hinterlegt (KAUFKRAFT_TIKTOK_REFRESH_TOKEN) - uebersprungen."
            exit 0
          fi
          python scripts/tiktok_story_publish.py --post-file assets/kaufkraft_generated/next_post.json

      # Story: dieselbe Grafik im 9:16-Format, direkt nach dem Feed-Post.
      - name: Story erstellen + committen
        id: story_build
        if: steps.publish.outcome == 'success'
        run: |
          python scripts/kaufkraft_story.py
          git add -A assets/kaufkraft_generated
          git commit -m "Kaufkraft-Story: $(TZ="Europe/Berlin" date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          sleep 20  # raw.githubusercontent.com braucht einen Moment

      - name: Story posten
        if: steps.story_build.outcome == 'success'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.WOE_ACCOUNT_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.WOE_ACCOUNT_ID }}
        run: >-
          python scripts/publish.py
          --post-file assets/kaufkraft_generated/next_story.json
          --expect-username "$IG_USERNAME"
