name: Token-Erneuerung (alle Accounts)

# Verlaengert jeden Montag alle Instagram-Tokens (gelten 60 Tage) und prueft die
# TikTok-Refresh-Tokens. Gibt Meta/TikTok einen neuen Token aus, wird er automatisch
# als GitHub-Secret gespeichert. Meldung per Telegram nur bei Problemen oder neuen Tokens.
#
# Einmalig noetig: Secret SECRETS_WRITE_TOKEN = fein granularer GitHub-Token
#   (github.com/settings/personal-access-tokens -> Generate new token
#    -> Repository access: nur dieses Repo -> Permissions: "Secrets: Read and write")

on:
  schedule:
    - cron: "41 6 * * 1"  # montags 07:41 / 08:41 deutscher Zeit
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur pruefen, nichts speichern?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Tokens verlaengern
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          JOTALABS_IG_ACCESS_TOKEN: ${{ secrets.JOTALABS_IG_ACCESS_TOKEN }}
          PTNE_API_TOKEN: ${{ secrets.PTNE_API_TOKEN }}
          HORROR_IG_ACCESS_TOKEN: ${{ secrets.HORROR_IG_ACCESS_TOKEN }}
          MYSTERY_IG_ACCESS_TOKEN: ${{ secrets.MYSTERY_IG_ACCESS_TOKEN }}
          WOE_ACCOUNT_TOKEN: ${{ secrets.WOE_ACCOUNT_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          HORROR_TIKTOK_REFRESH_TOKEN: ${{ secrets.HORROR_TIKTOK_REFRESH_TOKEN }}
          MYSTERY_TIKTOK_REFRESH_TOKEN: ${{ secrets.MYSTERY_TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && args="--dry-run"
          python scripts/refresh_tokens.py $args
