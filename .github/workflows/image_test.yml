name: Bild-Test (temporaer)
on:
  push:
    branches: [claude/instagram-reels-automation-koceqs]
    paths: [".github/workflows/image_test.yml"]
jobs:
  img:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests Pillow
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          cd scripts && python -u - <<'PY'
          import os, story_reel as sr
          p = "abandoned farmhouse at night, fog, cinematic, dark"
          try:
              sr.generate_pollinations(p, 1, os.environ["POLLINATIONS_API_KEY"], retries=1); print("Pollinations OK")
          except Exception as e: print("Pollinations:", str(e)[:300])
          for m in sr.MODEL_CHAIN:
              try:
                  sr.generate_cloudflare(m, p, os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["CLOUDFLARE_API_TOKEN"], retries=1, seed=1); print(m, "OK")
              except Exception as e: print(m, str(e)[:300])
          PY
