name: Streichholz-Zeitraffer (Test)

# Prototyp: erzeugt Stufenbilder + Video und legt sie auf dem Branch unter
# experiments/matchstick/out_v2 ab. Postet nichts.
on:
  workflow_dispatch:
  push:
    branches: ["ccr-**"]
    paths:
      - scripts/matchstick_timelapse.py
      - .github/workflows/matchstick_test.yml

permissions:
  contents: write

concurrency:
  group: matchstick-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q pillow numpy requests
      - name: Stufen erzeugen und Video rendern
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLI_TOKEN: ${{ secrets.POLLI_TOKEN }}
        run: python scripts/matchstick_timelapse.py --out experiments/matchstick/out_v2
      - name: Ergebnis auf den Branch legen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/matchstick/out_v2 || true
          git commit -m "Streichholz-Zeitraffer: Testlauf" || exit 0
          git pull --rebase -q || true
          git push
