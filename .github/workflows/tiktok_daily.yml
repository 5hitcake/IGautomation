name: Daily TikTok Post

on:
  schedule:
    - cron: "0 15 * * *"  # ~16-17 Uhr deutsche Zeit (MEZ/MESZ)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate TikTok video
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: python scripts/tiktok_generate_video.py

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tiktok_generated tiktok_posted_log.json
          git commit -m "Neues TikTok-Video: $(date -u +%Y-%m-%d)"
          git push

      - name: Publish to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/tiktok_publish.py
