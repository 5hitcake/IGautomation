name: Daily TikTok Post

on:
  schedule:
    - cron: "0 15 * * *"  # ~16-17 Uhr deutsche Zeit (MEZ/MESZ)
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Neues Video generieren? (nein = nur den zuletzt generierten Post erneut veroeffentlichen, z.B. zum Testen ohne HF-Kontingent zu verbrauchen)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # Die kostenlose, selbst gehostete Bildgenerierung (CPU, kein GPU) fuer die
    # nicht-kritischen Beats braucht ca. 10-15 Min./Bild - Qualitaet hat hier
    # bewusst Vorrang vor Geschwindigkeit, siehe README.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Generate TikTok video
        if: github.event.inputs.regenerate != 'false'
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: python scripts/tiktok_generate_video.py

      - name: Commit generated asset
        if: github.event.inputs.regenerate != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tiktok_generated tiktok_posted_log.json
          git commit -m "Neues TikTok-Video: $(date -u +%Y-%m-%d)"
          git push

      - name: Publish to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/tiktok_publish.py

      - name: Wait for raw.githubusercontent.com propagation
        run: sleep 15

      - name: Publish to Instagram (weirdworld.ai)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.WEIRDWORLD_IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.WEIRDWORLD_IG_ACCOUNT_ID }}
        run: python scripts/publish.py --post-file assets/tiktok_generated/next_post.json
