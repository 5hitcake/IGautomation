name: People Wochen-Auswertung

# Jeden Montag: Statistik der Posts der letzten 7 Tage von @people.that.dont.exist
# per Telegram, mit Auswertung nach Merkmalen (Ausschnitt, Alter, attraktiv, ...).
# Postet nichts. Zeit: Montag 14:07 UTC = 11:07 Argentinien.
on:
  schedule:
    - cron: "7 14 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Zeitraum in Tagen"
        default: "7"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests Pillow
      - name: Auswertung erstellen und per Telegram senden
        env:
          IG_ACCESS_TOKEN: ${{ secrets.PTNE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/people_insights.py --days "${{ github.event.inputs.days || '7' }}"
