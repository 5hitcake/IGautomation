name: Portrait model test

on:
  push:
    branches: [ccr-178c7728-27xf6u]
    paths: [".github/workflows/portrait_model_test.yml", "scripts/portrait_model_test.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check secrets (only length, never the value)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VAR_CF_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAR_CF_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "HF_TOKEN length: ${#HF_TOKEN}"
          echo "ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID} / API_TOKEN length: ${#CLOUDFLARE_API_TOKEN} / HF_TOKEN length: ${#HF_TOKEN} / IG_ACCESS_TOKEN (Vergleich) length: ${#IG_ACCESS_TOKEN} / vars.CLOUDFLARE_ACCOUNT_ID length: ${#VAR_CF_ID} / vars.CLOUDFLARE_API_TOKEN length: ${#VAR_CF_TOKEN}" > assets/portrait_test/secrets_check.txt
      - name: Verify Cloudflare token (no secret values printed)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY' | tee assets/portrait_test/token_check.txt
          import os, re, requests
          t = os.environ["CLOUDFLARE_API_TOKEN"]; a = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          print("token has whitespace/newline:", t != t.strip() or " " in t)
          print("account id looks like 32 hex:", bool(re.fullmatch(r"[0-9a-f]{32}", a.strip())))
          print("token prefix kind:", "cfut_/cfat_ style" if re.match(r"cf[a-z]{2}_", t.strip()) else "classic")
          h = {"Authorization": f"Bearer {t.strip()}"}
          for name, url in [("user token verify", "https://api.cloudflare.com/client/v4/user/tokens/verify"),
                            ("account token verify", f"https://api.cloudflare.com/client/v4/accounts/{a.strip()}/tokens/verify"),
                            ("list accounts", "https://api.cloudflare.com/client/v4/accounts")]:
              r = requests.get(url, headers=h, timeout=30)
              j = r.json()
              info = j.get("result")
              if name == "list accounts" and isinstance(info, list):
                  info = [{"id_matches_secret": x.get("id") == a.strip()} for x in info]
              elif isinstance(info, dict):
                  info = {k: info.get(k) for k in ("status", "expires_on", "not_before")}
              print(f"{name}: HTTP {r.status_code} success={j.get('success')} errors={j.get('errors')} result={info}")
          PY
      - name: Generate test portraits
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/portrait_model_test.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/portrait_test
          git commit -m "Portrait-Modelltest: Ergebnisse" || echo "nichts zu committen"
          git push
