name: Portrait model test

on:
  push:
    branches: [ccr-178c7728-27xf6u]
    paths: [".github/workflows/portrait_model_test.yml", "scripts/portrait_model_test.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check secrets (only length, never the value)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID} / API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}" > assets/portrait_test/secrets_check.txt
      - name: Generate test portraits
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/portrait_model_test.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/portrait_test
          git commit -m "Portrait-Modelltest: Ergebnisse" || echo "nichts zu committen"
          git push
