name: Daily Quote Post

on:
  schedule:
    - cron: "0 14 * * *"  # 16:00 deutsche Sommerzeit (MESZ, UTC+2)
    - cron: "0 15 * * *"  # 16:00 deutsche Winterzeit (MEZ, UTC+1)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Nur bei 16 Uhr deutscher Zeit fortfahren
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ="Europe/Berlin" date +%H)"
          if [ "$hour" = "16" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ueberspringe: aktuell $hour Uhr deutscher Zeit, nicht 16 Uhr (redundanter Cron-Trigger wegen Zeitumstellung)."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate quote card
        if: steps.gate.outputs.run == 'true'
        run: python scripts/generate_quote_card.py

      - name: Commit generated asset
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated posted_log.json
          git commit -m "Neuer Zitat-Post: $(date -u +%Y-%m-%d)"
          git push

      - name: Wait for raw.githubusercontent.com propagation
        if: steps.gate.outputs.run == 'true'
        run: sleep 15

      - name: Publish to Instagram
        if: steps.gate.outputs.run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python scripts/publish.py
