name: Instagram-Token pruefen

# Prueft fuer jeden Instagram-Account: Ist der Token gueltig, gehoert er zum richtigen Konto
# und passt die hinterlegte Konto-ID dazu? Postet und verlaengert nichts.
# Nach dem manuellen Erneuern der Tokens einmal starten: Actions -> "Instagram-Token pruefen".
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Tokens pruefen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          JOTALABS_IG_ACCESS_TOKEN: ${{ secrets.JOTALABS_IG_ACCESS_TOKEN }}
          JOTALABS_IG_ACCOUNT_ID: ${{ secrets.JOTALABS_IG_ACCOUNT_ID }}
          PTNE_API_TOKEN: ${{ secrets.PTNE_API_TOKEN }}
          PTNE_ACCOUNT_TOKEN: ${{ secrets.PTNE_ACCOUNT_TOKEN }}
          HORROR_IG_ACCESS_TOKEN: ${{ secrets.HORROR_IG_ACCESS_TOKEN }}
          HORROR_IG_ACCOUNT_ID: ${{ secrets.HORROR_IG_ACCOUNT_ID }}
          MYSTERY_IG_ACCESS_TOKEN: ${{ secrets.MYSTERY_IG_ACCESS_TOKEN }}
          MYSTERY_IG_ACCOUNT_ID: ${{ secrets.MYSTERY_IG_ACCOUNT_ID }}
          WOE_ACCOUNT_TOKEN: ${{ secrets.WOE_ACCOUNT_TOKEN }}
          WOE_ACCOUNT_ID: ${{ secrets.WOE_ACCOUNT_ID }}
        shell: python
        run: |
          import os, sys, requests
          # (Token-Secret, ID-Secret, Account)
          pairs = [
              ("IG_ACCESS_TOKEN", "IG_ACCOUNT_ID", "@mindset_und.motivation"),
              ("JOTALABS_IG_ACCESS_TOKEN", "JOTALABS_IG_ACCOUNT_ID", "@jota_labsweb"),
              ("PTNE_API_TOKEN", "PTNE_ACCOUNT_TOKEN", "These People Do Not Exist"),
              ("HORROR_IG_ACCESS_TOKEN", "HORROR_IG_ACCOUNT_ID", "Gruselgeschichten"),
              ("MYSTERY_IG_ACCESS_TOKEN", "MYSTERY_IG_ACCOUNT_ID", "Raetsel & Verschwoerungen"),
              ("WOE_ACCOUNT_TOKEN", "WOE_ACCOUNT_ID", "@kaufkraft.check"),
          ]
          fail = False
          for tok_name, id_name, label in pairs:
              token, acc_id = os.environ.get(tok_name, "").strip(), os.environ.get(id_name, "").strip()
              if not token:
                  print(f"⚠️ {label}: {tok_name} nicht gesetzt"); fail = True; continue
              r = requests.get("https://graph.instagram.com/v21.0/me",
                               params={"fields": "user_id,username", "access_token": token}, timeout=30)
              d = r.json()
              if "error" in d:
                  print(f"⚠️ {label}: Token ungueltig - {d['error'].get('message', '?')[:120]}"); fail = True; continue
              ids = {str(d.get("user_id", "")), str(d.get("id", ""))}
              if not acc_id:
                  id_info = f"{id_name} nicht gesetzt"; fail = True
              elif acc_id in ids:
                  id_info = "ID passt"
              else:
                  id_info = f"{id_name} passt NICHT zum Token - neue ID aus dem Meta-Dashboard eintragen"; fail = True
              ok = id_info == "ID passt"
              print(f"{'✅' if ok else '⚠️'} {label}: Token gehoert zu @{d.get('username')}, {id_info}")
          sys.exit(1 if fail else 0)
