name: These People Do Not Exist

# 3 Posts pro Tag zu Stosszeiten fuer ein englischsprachiges, internationales
# Publikum (Europa + USA). Freigabe per Telegram (✅ / 🔄 / ❌), ohne Antwort wird
# automatisch gepostet. Zeiten in UTC (Argentinien = UTC-3):
#   07:30  Sammel-Freigabe: beide Personen fuer 11:13 und 17:13 auf einmal
#          (04:30 Argentinien, vor der Arbeit); freigegebene landen in assets/people_queue/
#   11:13  Post aus der Warteschlange (08:13 AR / 12-13 Uhr DE / 7 Uhr US-Ost)
#   17:13  Post aus der Warteschlange (14:13 AR / 18-19 Uhr DE / 13 Uhr US-Ost)
#   20:43  Freigabe -> Post um 23:43 (17:43 -> 20:43 AR / 19-20 Uhr US-Ost)
on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "13 11 * * *"
    - cron: "13 17 * * *"
    - cron: "43 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Was soll passieren?"
        type: choice
        default: "Einzelner Post"
        options:
          - "Einzelner Post"
          - "Morgen-Freigabe (2 Personen fuer 8:13 + 14:13)"
          - "Warteschlange 8:13 jetzt posten"
          - "Warteschlange 14:13 jetzt posten"
      wait_minutes:
        description: "Nur bei Einzelner Post: Minuten Bedenkzeit per Telegram"
        default: "15"

permissions:
  contents: write

env:
  # Story zum Post: so viele Minuten NACH dem Feed-Post (0 = gleichzeitig).
  STORY_DELAY_MINUTES: "60"
  # Reels statt Bild-Posts. Wird eingeschaltet, sobald der eigene Song
  # (assets/people_music/theme.*) vorliegt.
  REEL_ENABLED: "false"

concurrency:
  group: people-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Pruefen, ob Secrets gesetzt sind
        id: gate
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_IG: ${{ secrets.PTNE_API_TOKEN != '' && secrets.PTNE_ACCOUNT_TOKEN != '' }}
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN fehlen - nichts zu tun."
            exit 0
          fi
          if [ "$HAS_IG" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PTNE_API_TOKEN / PTNE_ACCOUNT_TOKEN fehlen - Post uebersprungen (siehe README)."
            exit 0
          fi
          # Schutz gegen Doppelposts, falls GitHub einen geplanten Lauf doppelt startet.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "30 7 * * *" ]; then
            last=$(git log -1 --grep="Neue Person:" --format=%ct || true)
            if [ -n "$last" ] && [ $(( $(date +%s) - last )) -lt 7200 ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ueberspringe: letzter Post ist weniger als 2 Stunden her."
              exit 0
            fi
          fi
          # Sammel-Freigabe nur einmal pro Tag (geplant ODER per Knopf).
          is_queue=false
          [ "${{ github.event.schedule }}" = "30 7 * * *" ] && is_queue=true
          case "${{ github.event.inputs.mode }}" in Morgen*) is_queue=true ;; esac
          if [ "$is_queue" = true ]; then
            if git log --since="$(date -u +%Y-%m-%d)T00:00:00Z" --grep="Freigabe-Warteschlange:" --oneline | grep -q .; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ueberspringe: Die Morgen-Freigabe lief heute schon."
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Posting-Termin bestimmen
        id: when
        if: steps.gate.outputs.run == 'true'
        run: |
          case "${{ github.event.schedule }}" in
            "30 7 * * *")  echo "args=--queue 11:13,17:13" >> "$GITHUB_OUTPUT" ;;
            "13 11 * * *") echo "args=--from-queue 11:13" >> "$GITHUB_OUTPUT" ;;
            "13 17 * * *") echo "args=--from-queue 17:13" >> "$GITHUB_OUTPUT" ;;
            "43 20 * * *") echo "args=--target 23:43" >> "$GITHUB_OUTPUT" ;;
            *)
              case "${{ github.event.inputs.mode }}" in
                Morgen*) echo "args=--queue 11:13,17:13" >> "$GITHUB_OUTPUT" ;;
                "Warteschlange 8:13"*) echo "args=--from-queue 11:13" >> "$GITHUB_OUTPUT" ;;
                "Warteschlange 14:13"*) echo "args=--from-queue 17:13" >> "$GITHUB_OUTPUT" ;;
                *) echo "args=--wait-minutes ${{ github.event.inputs.wait_minutes || '15' }}" >> "$GITHUB_OUTPUT" ;;
              esac ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests Pillow

      - name: Person erzeugen + Freigabe per Telegram
        id: review
        if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/people_review.py ${{ steps.when.outputs.args }}

      - name: Freigegebene Personen in die Warteschlange legen
        if: steps.review.outputs.queued == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/people_queue
          git commit -m "Freigabe-Warteschlange: $(date -u +'%Y-%m-%d')" || echo "nichts zu committen"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Reel rendern (Zoom, Glitch, Text, eigener Song)
        if: steps.review.outputs.publish == 'true' && env.REEL_ENABLED == 'true'
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          python scripts/people_reel.py

      - name: Commit Bild
        if: steps.review.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/people_generated people_posted_log.json
          git add -A assets/people_queue 2>/dev/null || true
          git commit -m "Neue Person: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Reel auf den Medien-Branch legen (haelt main klein)
        if: steps.review.outputs.publish == 'true' && env.REEL_ENABLED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp assets/people_generated/reel_*.mp4 "$tmp/"
          cd "$tmp"
          git init -q -b people-media
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Aktuelles Reel"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" people-media
          sleep 20  # raw.githubusercontent.com braucht einen Moment

      - name: Publish to Instagram (@people.that.dont.exist)
        id: publish
        if: steps.review.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.PTNE_API_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.PTNE_ACCOUNT_TOKEN }}
        run: python scripts/publish.py --post-file assets/people_generated/next_post.json

      - name: Feed-Post per Telegram bestaetigen
        if: steps.publish.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/people_review.py --notify "📸 Gepostet auf @people.that.dont.exist - Story folgt in ${STORY_DELAY_MINUTES} Min."

      - name: Story erstellen + committen
        id: story_build
        if: steps.publish.outcome == 'success'
        run: |
          python scripts/people_story.py
          git add -A assets/people_generated
          git commit -m "Neue Person: Story"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Story posten
        id: story
        if: steps.story_build.outcome == 'success'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.PTNE_API_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.PTNE_ACCOUNT_TOKEN }}
        run: |
          sleep $(( STORY_DELAY_MINUTES * 60 ))
          python scripts/publish.py --post-file assets/people_generated/next_story.json

      - name: Ergebnis per Telegram melden
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.story.outcome }}" = "success" ]; then
            msg="📲 Story ist online"
          elif [ "${{ steps.publish.outcome }}" = "success" ]; then
            msg="⚠️ Post ist online, aber die Story ist fehlgeschlagen - Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "${{ steps.publish.outcome }}" = "failure" ] || [ "${{ steps.review.outcome }}" = "failure" ]; then
            msg="⚠️ Fehler beim Posten - Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            exit 0
          fi
          pip install -q requests Pillow 2>/dev/null || true
          python scripts/people_review.py --notify "$msg"

      - name: Bei Abbruch per Telegram warnen
        if: cancelled() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests Pillow 2>/dev/null || true
          python scripts/people_review.py --notify "⚠️ Lauf abgebrochen - die Knöpfe der letzten Anfrage sind nicht mehr aktiv, es wurde nichts gepostet."
