name: TikTok-Zugang pruefen (temporaer, Lauf 3)
on:
  push:
    branches: [claude/instagram-reels-automation-koceqs]
    paths: [".github/workflows/tiktok_check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pruefen (nur lesend, gibt keine Geheimnisse aus)
        env:
          KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          HORROR_RT: ${{ secrets.HORROR_TIKTOK_REFRESH_TOKEN }}
          MYSTERY_RT: ${{ secrets.MYSTERY_TIKTOK_REFRESH_TOKEN }}
        run: |
          mkdir -p out
          python3 - <<'PY' | tee out/result.txt
          import json, os, urllib.parse, urllib.request, urllib.error
          def post(url, data, headers=None):
              req = urllib.request.Request(url, data=urllib.parse.urlencode(data).encode(),
                                           headers={"Content-Type": "application/x-www-form-urlencoded", **(headers or {})})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  try: return json.loads(e.read().decode())
                  except Exception: return {"error": f"HTTP {e.code}"}
          key, secret = os.environ.get("KEY", "").strip(), os.environ.get("SECRET", "").strip()
          print(f"TIKTOK_CLIENT_KEY gesetzt: {'ja' if key else 'NEIN'} (Laenge {len(key)})")
          print(f"TIKTOK_CLIENT_SECRET gesetzt: {'ja' if secret else 'NEIN'} (Laenge {len(secret)})")
          if key and secret:
              r = post("https://open.tiktokapis.com/v2/oauth/token/", {"client_key": key, "client_secret": secret, "grant_type": "client_credentials"})
              print("Key + Secret von TikTok akzeptiert:", "JA" if "access_token" in r else f"NEIN -> {r.get('error')} {r.get('error_description', '')}")
          for name in ("HORROR", "MYSTERY"):
              rt = os.environ.get(f"{name}_RT", "").strip()
              if not rt:
                  print(f"{name}_TIKTOK_REFRESH_TOKEN: noch nicht angelegt")
                  continue
              r = post("https://open.tiktokapis.com/v2/oauth/token/", {"client_key": key, "client_secret": secret, "grant_type": "refresh_token", "refresh_token": rt})
              if "access_token" not in r:
                  print(f"{name}_TIKTOK_REFRESH_TOKEN: FEHLER -> {r.get('error')} {r.get('error_description', '')}")
                  continue
              req = urllib.request.Request("https://open.tiktokapis.com/v2/user/info/?fields=open_id,display_name",
                                           headers={"Authorization": f"Bearer {r['access_token']}"})
              try:
                  raw = json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  raw = {"http": e.code, "body": e.read().decode()[:200]}
              user = raw.get("data", {}).get("user", {}) if isinstance(raw.get("data"), dict) else {}
              oid = str(r.get("open_id", ""))
              print(f"{name}: Anzeigename='{user.get('display_name')}', Konto-ID endet auf ...{oid[-6:]}, API-Antwort-Fehler: {raw.get('error', raw.get('http'))}")
          PY
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q -b tiktok-check-result && git add . && git -c user.name=bot -c user.email=bot@x commit -qm check
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tiktok-check-result
