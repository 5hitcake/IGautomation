name: Power of Christ (Vers + Bibelgeschichte)

# Zwei Reels pro Tag für @Power of Christ:
#   Vers-Reel   – Start 06:52 deutscher Zeit, online ca. 07:00
#   Story-Reel  – Start 16:22 deutscher Zeit, online ca. 16:35 (Prime Time 16–18 Uhr)
# Gestartet pünktlich vom Cloudflare-Zeitgeber (cloudflare/people_scheduler, POC_SLOTS)
# per workflow_dispatch mit "slot". Sommer-/Winterzeit rechnet der Zeitgeber selbst um.
# Code, Verse und Geschichten: Ordner poc/ (siehe poc/README.md).
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Was?"
        type: choice
        default: verse
        options: [verse, story]
      publish:
        description: "Posten? (nein = nur Video bauen, Download unter Artifacts)"
        type: boolean
        default: false
      slot:
        description: "Nur für den Zeitgeber - leer lassen"
        default: ""

permissions:
  contents: write

concurrency:
  group: power-of-christ
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Plan bestimmen
        id: plan
        env:
          SLOT: ${{ github.event.inputs.slot }}
          HAS_IG: ${{ secrets.POWEROFCHRIST_ACCESS_TOKEN != '' && secrets.POWEROFCHRIST_ACCOUNT_ID != '' }}
        run: |
          kind="${{ github.event.inputs.kind }}"
          publish="${{ github.event.inputs.publish }}"
          case "$SLOT" in
            poc-verse) kind=verse; publish=true ;;
            poc-story) kind=story; publish=true ;;
          esac
          run=true
          if [ "$publish" = "true" ] && [ "$HAS_IG" != "true" ]; then
            echo "::warning::POWEROFCHRIST_ACCESS_TOKEN / POWEROFCHRIST_ACCOUNT_ID fehlen - übersprungen."
            run=false
          fi
          if [ -n "$SLOT" ]; then
            # Schutz gegen doppelte geplante Läufe (z.B. Zeitgeber feuert zweimal)
            last=$(git log -1 --grep="Power of Christ ($kind)" --format=%ct || true)
            if [ -n "$last" ] && [ $(( $(date +%s) - last )) -lt 36000 ]; then
              echo "Überspringe: letztes $kind-Reel ist weniger als 10 Stunden her."
              run=false
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Art: $kind, posten: $publish, starten: $run"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        if: steps.plan.outputs.run == 'true'
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install requests Pillow pyyaml "edge-tts>=7.3.1"

      - name: Reel bauen
        if: steps.plan.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python poc/src/run.py build ${{ steps.plan.outputs.kind }}

      - name: Video als Download bereitstellen
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: powerofchrist-${{ steps.plan.outputs.kind }}
          path: |
            poc/out/${{ steps.plan.outputs.kind }}/reel_*.mp4
            poc/out/${{ steps.plan.outputs.kind }}/next_post.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Video auf den Medien-Branch legen
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.plan.outputs.kind }}
        run: |
          tmp=$(mktemp -d)
          cp poc/out/$KIND/reel_*.mp4 "$tmp/"
          cd "$tmp"
          git init -q -b "poc-media-$KIND"
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Aktuelles Reel"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "poc-media-$KIND"
          sleep 20  # raw.githubusercontent.com braucht einen Moment

      - name: Auf Instagram veröffentlichen
        id: publish
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.publish == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.POWEROFCHRIST_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.POWEROFCHRIST_ACCOUNT_ID }}
          KIND: ${{ steps.plan.outputs.kind }}
        run: |
          expected=$(python -c "import yaml;print(yaml.safe_load(open('poc/config.yaml'))['account'].get('instagram_username') or '')")
          check=""
          [ -n "$expected" ] && check="--expect-username $expected"
          set -o pipefail
          for attempt in 1 2; do
            if python scripts/publish.py --post-file poc/out/$KIND/next_post.json $check 2>&1 | tee publish.log; then
              exit 0
            fi
            grep -q "Media-Verarbeitung fehlgeschlagen" publish.log || exit 1
            [ "$attempt" = 2 ] && exit 1
            echo "::warning::Instagram konnte das Video nicht verarbeiten - neuer Versuch in 90 s."
            sleep 90
          done

      - name: Verlauf speichern
        if: steps.publish.outcome == 'success'
        run: |
          python poc/src/run.py done ${{ steps.plan.outputs.kind }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poc/state/history.json
          git commit -m "Power of Christ (${{ steps.plan.outputs.kind }}): $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Ergebnis per Telegram melden
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.publish == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          kind="${{ steps.plan.outputs.kind }}"
          if [ "${{ steps.publish.outcome }}" = "success" ]; then
            msg="✝️ Power of Christ: $kind-Reel ist online"
          else
            msg="⚠️ Power of Christ: $kind-Reel fehlgeschlagen - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if grep -q "OAuthException\|Error validating access token" publish.log 2>/dev/null; then
              msg="$msg"$'\n\n'"🔑 Instagram-Zugang ungültig - bitte POWEROFCHRIST_ACCESS_TOKEN erneuern."
            fi
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" > /dev/null
