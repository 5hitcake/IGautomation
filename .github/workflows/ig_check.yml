name: Instagram-Zugang pruefen (temporaer)

# Nur lesend: prueft die Tokens und fragt den Account-Namen ab. Postet nichts.
on:
  push:
    branches: [claude/instagram-reels-automation-koceqs]
    paths: [".github/workflows/ig_check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tokens pruefen
        env:
          HORROR_TOKEN: ${{ secrets.HORROR_IG_ACCESS_TOKEN }}
          HORROR_ID: ${{ secrets.HORROR_IG_ACCOUNT_ID }}
          MYSTERY_TOKEN: ${{ secrets.MYSTERY_IG_ACCESS_TOKEN }}
          MYSTERY_ID: ${{ secrets.MYSTERY_IG_ACCOUNT_ID }}
        run: |
          mkdir -p out
          python3 - <<'PY' | tee out/result.txt
          import json, os, urllib.request, urllib.error
          for acc in ("HORROR", "MYSTERY"):
              token = os.environ.get(f"{acc}_TOKEN", "").strip()
              acc_id = os.environ.get(f"{acc}_ID", "").strip()
              print(f"== {acc}: Token gesetzt: {'ja' if token else 'NEIN'}, Account-ID gesetzt: {'ja' if acc_id else 'NEIN'}")
              if not token:
                  continue
              url = f"https://graph.instagram.com/v21.0/me?fields=user_id,username,account_type&access_token={token}"
              try:
                  data = json.load(urllib.request.urlopen(url, timeout=30))
                  print(f"   Token gueltig. Username: @{data.get('username')}, Typ: {data.get('account_type')}")
                  print(f"   Account-ID passt zum Token: {'ja' if str(data.get('user_id')) == acc_id else 'NEIN (Token-ID ' + str(data.get('user_id')) + ')'}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:300].replace(token, "***")
                  print(f"   FEHLER {e.code}: {body}")
              if acc_id:
                  try:
                      url = f"https://graph.instagram.com/v21.0/{acc_id}/content_publishing_limit?fields=quota_usage,config&access_token={token}"
                      data = json.load(urllib.request.urlopen(url, timeout=30))
                      print(f"   Veroeffentlichen erlaubt (Limit-Abfrage ok): {json.dumps(data.get('data', data))[:200]}")
                  except urllib.error.HTTPError as e:
                      print(f"   Publish-Pruefung FEHLER {e.code}: {e.read().decode()[:300].replace(token, '***')}")
          PY
      - name: Ergebnis ablegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b ig-check-result
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "IG-Check"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ig-check-result
