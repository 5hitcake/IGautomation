name: Android Release Build (Dragonslide)

# Builds and signs the Android App Bundle (.aab) for Play Console upload.
# Manual trigger only - this produces a real, signed release artifact, so
# it shouldn't run on every push. The signing keystore never touches the
# repo: it's decoded from a secret into a gitignored path, used only for
# this job, then discarded when the runner is torn down.
#
# Also fetches the real app icon/splash/screenshots from the CDN
# (mobile/fetch-brand-assets.sh) and commits them if they aren't already in
# the repo - the Claude coding sandbox that otherwise develops this project
# can't reach that CDN, but this runner isn't subject to that restriction.
# Once committed once, this step is a no-op on future runs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Pillow (used by fetch-brand-assets.sh's sanity check)
        run: pip install --quiet pillow

      - name: Fetch brand assets (icon/splash/screenshots) + regenerate native icons
        working-directory: mobile
        run: bash fetch-brand-assets.sh

      - name: Commit brand assets if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/resources mobile/store/screenshots \
                  mobile/android/app/src/main/res mobile/ios/App/App/Assets.xcassets
          git diff --cached --quiet && echo "No brand-asset changes to commit" || \
            git commit -m "Mobile: real app icon/splash/screenshots, regenerated native sizes"
          git push

      - name: Sync Capacitor (web assets + native config/plugins)
        working-directory: mobile
        run: npx cap sync android

      - name: Decode release keystore
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release AAB
        working-directory: mobile/android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - name: Collect build info
        id: info
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' mobile/android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' mobile/android/app/build.gradle)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonslide-v${{ steps.info.outputs.version_code }}.aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Commit signed AAB to the branch
        run: |
          mkdir -p mobile/releases
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "mobile/releases/dragonslide-v${{ steps.info.outputs.version_code }}-${{ steps.info.outputs.version_name }}.aab"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/releases/
          git diff --cached --quiet && echo "No AAB changes to commit" && exit 0
          git commit -m "Mobile: signed release AAB v${{ steps.info.outputs.version_code }} (${{ steps.info.outputs.version_name }})"
          git push
