name: Vorschau-Test Mystery (temporaer)
on:
  push:
    branches: [claude/instagram-reels-automation-koceqs]
    paths: [".github/workflows/preview_test.yml"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          pip install -q requests Pillow "edge-tts>=7.3.1"
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLI_TOKEN }}
        run: python -u scripts/story_reel.py --account mysteries --preview 2>&1 | tee preview_log.txt
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp assets/story_reels/mysteries/reel_*.mp4 out/ 2>/dev/null; cp preview_log.txt out/
          cd out && git init -q -b story-preview && git add . && git -c user.name=bot -c user.email=bot@x commit -qm preview
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" story-preview
