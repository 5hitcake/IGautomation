<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mjölnir Lost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@500;800&display=swap">
<style>
  /* Single-look game: iron night, gold trim, blood-red accents. */
  :root{--bg:#0d1016;--fg:#f3e7c9;--gold:#e0a93b;--iron:#141a24;color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block;outline:none}
  .pad{position:fixed;z-index:5;display:none;gap:14px;bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  body.touch .pad{display:flex}
  #padL{left:calc(14px + env(safe-area-inset-left, 0px))}
  #padR{right:calc(14px + env(safe-area-inset-right, 0px));align-items:flex-end}
  .tb{width:70px;height:70px;border-radius:50%;border:2px solid rgba(224,169,59,.75);background:rgba(20,26,36,.5);
      color:var(--fg);font:800 15px "Alegreya Sans","Trebuchet MS",sans-serif;letter-spacing:.06em;
      display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
  .tb.on{background:rgba(224,169,59,.45)}
  .tb svg{width:30px;height:30px;fill:var(--fg)}
  #bJump{width:90px;height:90px;font-size:17px}
  #bRun{width:62px;height:62px;font-size:13px}
  #top{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top, 0px));right:calc(10px + env(safe-area-inset-right, 0px));display:flex;gap:8px}
  .ib{width:42px;height:42px;border-radius:10px;border:2px solid rgba(224,169,59,.65);background:rgba(20,26,36,.6);
      color:var(--fg);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .ib svg{width:20px;height:20px;fill:var(--fg)}
  .ib:focus-visible,.tb:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Mjölnir Lost, a Viking platformer"></canvas>
<div id="top">
  <button class="ib" id="bSound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path id="sndPath" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#f3e7c9" stroke-width="2" fill="#f3e7c9"/></svg></button>
  <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
</div>
<div class="pad" id="padL">
  <button class="tb" id="bLeft" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
  <button class="tb" id="bRight" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
</div>
<div class="pad" id="padR">
  <button class="tb" id="bRun" aria-label="Sprint">RUN</button>
  <button class="tb" id="bJump" aria-label="Jump">JUMP</button>
</div>
<script>
(() => {
'use strict';

/* ============================================================
   Core constants
   ============================================================ */
const TS = 48, ROWS = 12, VH = ROWS * TS;
const T = { EMPTY:0, GROUND:1, BRICK:2, QCOIN:3, QMEAD:4, USED:5, PLANK:6, SPIKE:7 };
const SOLID = [false, true, true, true, true, true, false, false];
const DISPLAY = '"Uncial Antiqua", "Palatino Linotype", Georgia, serif';
const BODY = '"Alegreya Sans", "Trebuchet MS", system-ui, sans-serif';
const GRAV = 2300;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ============================================================
   Canvas & scaling
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 1024, scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  scale = Math.min(H / VH, W / 640);
  VW = Math.min(W / scale, 1400);
  offX = (W - VW * scale) / 2; offY = (H - VH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

/* ============================================================
   Runes (Elder Futhark, drawn as carved strokes)
   ============================================================ */
const RUNES = {
  f:[[0,0,0,1],[0,.3,.55,0],[0,.55,.55,.25]],
  u:[[0,0,0,1],[0,0,.55,.3],[.55,.3,.55,1]],
  th:[[0,0,0,1],[0,.25,.5,.5],[.5,.5,0,.75]],
  a:[[0,0,0,1],[0,0,.55,.3],[0,.3,.55,.6]],
  r:[[0,0,0,1],[0,0,.5,.22],[.5,.22,0,.46],[0,.46,.55,1]],
  k:[[.55,0,0,.3],[0,.3,.55,.6]],
  g:[[0,0,.6,1],[.6,0,0,1]],
  w:[[0,0,0,1],[0,0,.5,.22],[.5,.22,0,.46]],
  h:[[0,0,0,1],[.6,0,.6,1],[0,.3,.6,.55]],
  n:[[.3,0,.3,1],[.05,.3,.55,.55]],
  i:[[.3,0,.3,1]],
  j:[[.3,.05,.05,.3],[.05,.3,.3,.55],[.3,.45,.55,.7],[.55,.7,.3,.95]],
  p:[[0,0,0,1],[0,0,.5,.25],[0,1,.5,.75]],
  z:[[.3,0,.3,1],[.3,.4,0,0],[.3,.4,.6,0]],
  s:[[.55,0,.1,.35],[.1,.35,.5,.65],[.5,.65,.05,1]],
  t:[[.3,0,.3,1],[.3,0,0,.3],[.3,0,.6,.3]],
  b:[[0,0,0,1],[0,0,.5,.25],[.5,.25,0,.5],[0,.5,.5,.75],[.5,.75,0,1]],
  e:[[0,0,0,1],[.6,0,.6,1],[0,0,.3,.3],[.3,.3,.6,0]],
  m:[[0,0,0,1],[.6,0,.6,1],[0,0,.6,.45],[.6,0,0,.45]],
  l:[[0,0,0,1],[0,0,.5,.3]],
  o:[[.3,0,0,.35],[.3,0,.6,.35],[0,.35,.6,1],[.6,.35,0,1]],
  d:[[0,0,0,1],[.6,0,.6,1],[0,0,.6,1],[0,1,.6,0]],
};
const RUNE_KEYS = Object.keys(RUNES);
const LAT = {a:'a',á:'a',b:'b',c:'k',d:'d',ð:'th',e:'e',é:'e',f:'f',g:'g',h:'h',i:'i',í:'i',j:'j',k:'k',l:'l',m:'m',n:'n',o:'o',ö:'o',ó:'o',p:'p',q:'k',r:'r',s:'s',t:'t',u:'u',ú:'u',v:'w',w:'w',x:'k',y:'j',z:'z',þ:'th',ä:'a',ø:'o'};
function runeWord(str) {
  const s = str.toLowerCase(), out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === 't' && s[i + 1] === 'h') { out.push('th'); i++; continue; }
    if (s[i] === ' ') { out.push(null); continue; }
    if (LAT[s[i]]) out.push(LAT[s[i]]);
  }
  return out;
}
function drawRune(g, key, x, y, h, color, lw) {
  const R = RUNES[key]; if (!R) return;
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (const s of R) { g.moveTo(x + s[0] * h, y + s[1] * h); g.lineTo(x + s[2] * h, y + s[3] * h); }
  g.stroke();
}
function drawRuneText(g, str, cx, y, h, color, lw) {
  const w = runeWord(str), step = h * .72;
  let x = cx - (w.length * step - h * .12) / 2;
  for (const k of w) { if (k) drawRune(g, k, x, y, h, color, lw); x += step; }
}

/* ============================================================
   Nordic symbols
   ============================================================ */
function drawValknut(g, x, y, s, color, lw) {
  g.save(); g.translate(x, y); g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = 'round';
  for (let k = 0; k < 3; k++) {
    const a = -Math.PI / 2 + k * Math.PI * 2 / 3, ox = Math.cos(a) * s * .28, oy = Math.sin(a) * s * .28;
    g.beginPath();
    for (let j = 0; j < 3; j++) {
      const b = Math.PI / 2 + j * Math.PI * 2 / 3;
      const px = ox + Math.cos(b) * s * .5, py = oy - Math.sin(b) * s * .5;
      j ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
  }
  g.restore();
}
function drawKnotBand(g, x, y, w, color, amp) {
  g.save(); g.strokeStyle = color; g.lineWidth = 2;
  for (let p = 0; p < 2; p++) {
    g.beginPath();
    for (let i = 0; i <= w; i += 3) {
      const yy = y + Math.sin(i / 9 + p * Math.PI) * amp;
      i ? g.lineTo(x + i, yy) : g.moveTo(x + i, yy);
    }
    g.stroke();
  }
  g.restore();
}
function drawShield(g, x, y, r, full, c1, c2) {
  g.save(); g.translate(x, y);
  if (full) {
    for (let q = 0; q < 4; q++) {
      g.fillStyle = q % 2 ? c2 : c1; g.beginPath(); g.moveTo(0, 0);
      g.arc(0, 0, r, q * Math.PI / 2, (q + 1) * Math.PI / 2); g.closePath(); g.fill();
    }
  } else { g.fillStyle = 'rgba(40,44,52,.75)'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); }
  g.strokeStyle = full ? '#4a3a26' : 'rgba(120,120,120,.6)'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(0, 0, r - 1, 0, 7); g.stroke();
  g.fillStyle = full ? '#c9cfd6' : '#666'; g.beginPath(); g.arc(0, 0, r * .3, 0, 7); g.fill();
  g.restore();
}

/* ============================================================
   Mjölnir
   ============================================================ */
function drawMjolnir(g, x, y, s, ang, glow) {
  g.save(); g.translate(x, y); g.rotate(ang || 0); g.scale(s, s);
  if (glow) {
    const gr = g.createRadialGradient(0, -6, 2, 0, -6, 46);
    gr.addColorStop(0, `rgba(170,215,255,${.55 * glow})`); gr.addColorStop(1, 'rgba(170,215,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, -6, 46, 0, 7); g.fill();
  }
  // handle
  g.fillStyle = '#5b3b22'; g.fillRect(-3, -4, 6, 26);
  g.fillStyle = '#3a2615'; for (let i = 0; i < 5; i++) g.fillRect(-3.5, -1 + i * 4.6, 7, 1.6);
  g.fillStyle = '#c9a045'; g.fillRect(-4, 20, 8, 4);
  g.strokeStyle = '#3a2615'; g.lineWidth = 1.6; g.beginPath(); g.ellipse(0, 28, 3, 4.5, 0, 0, 7); g.stroke();
  // head
  g.fillStyle = '#9aa3ad';
  g.beginPath(); g.moveTo(-19, -22); g.lineTo(19, -22); g.lineTo(21, -18); g.lineTo(21, -5); g.lineTo(19, -1);
  g.lineTo(-19, -1); g.lineTo(-21, -5); g.lineTo(-21, -18); g.closePath(); g.fill();
  g.fillStyle = '#c7ced6'; g.fillRect(-19, -22, 38, 5);
  g.fillStyle = '#6d7680'; g.fillRect(-19, -5, 38, 4);
  g.strokeStyle = '#59616b'; g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(-12, -17); g.lineTo(-12, -5); g.moveTo(12, -17); g.lineTo(12, -5); g.stroke();
  // knot in the middle
  g.strokeStyle = '#e8c96a'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(-6, -15); g.quadraticCurveTo(0, -5, 6, -15); g.moveTo(-6, -7); g.quadraticCurveTo(0, -17, 6, -7); g.stroke();
  g.restore();
}

/* ============================================================
   Characters
   ============================================================ */
function drawThor(g, x, y, o) {
  g.save(); g.translate(x, y); if (o.face < 0) g.scale(-1, 1);
  const t = o.t, run = o.run || 0, ph = o.phase || 0;
  const air = o.air;
  const bob = air ? 0 : -Math.abs(Math.sin(ph)) * 2.2 * run + Math.sin(t * 2.2) * .8 * (1 - run);
  const legA = air ? .55 : Math.sin(ph) * .8 * run;
  let armA = air ? -2.3 : -Math.sin(ph) * .9 * run;
  let armB = air ? -2.0 : Math.sin(ph) * .9 * run;
  if (o.raise) { armA = -2.9; armB = -.4; }
  if (o.fist) { armA = -2.5 + Math.sin(t * 22) * .25; }
  g.translate(0, bob);
  const SK = '#f0b089', SKD = '#d38f68', HAIR = '#d4572a', HAIRD = '#a63d1b', HAIRL = '#f08c4c';
  const TUN = '#3f5f86', TUND = '#2c4566', BELT = '#5a3a22', GOLD = '#e8b33e';
  const PANT = '#5b4632', BOOT = '#3b2a1d', FUR = '#d6c3a2', CAPE = '#b4281f', CAPED = '#7e1a14';
  const STEEL = '#c9cfd6', STEELD = '#8b939c';
  const fl = Math.sin(t * 9) * 3 * (run + .2) + (air ? -7 : 0);
  // cape
  g.fillStyle = CAPED;
  g.beginPath(); g.moveTo(-9, -34); g.quadraticCurveTo(-19 - run * 8, -20 + fl, -22 - run * 12, -3 + fl * .6);
  g.lineTo(-4, -8); g.closePath(); g.fill();
  g.fillStyle = CAPE;
  g.beginPath(); g.moveTo(-7, -34); g.quadraticCurveTo(-15 - run * 7, -21 + fl, -17 - run * 10, -5 + fl * .6);
  g.lineTo(-3, -10); g.closePath(); g.fill();
  // long hair flowing back
  g.fillStyle = HAIRD;
  g.beginPath(); g.moveTo(-1, -52); g.quadraticCurveTo(-17 - run * 5, -48, -16 - run * 7, -24 + fl * .4);
  g.quadraticCurveTo(-9, -27, -4, -36); g.closePath(); g.fill();
  g.fillStyle = HAIR;
  g.beginPath(); g.moveTo(0, -52); g.quadraticCurveTo(-14 - run * 4, -48, -13 - run * 6, -27 + fl * .4);
  g.quadraticCurveTo(-7, -30, -3, -38); g.closePath(); g.fill();
  const leg = (hx, a, dark) => {
    g.save(); g.translate(hx, -17); g.rotate(a);
    g.fillStyle = dark ? '#47372a' : PANT; rr(g, -4.5, 0, 9, 10, 3); g.fill();
    g.fillStyle = dark ? '#2b1f16' : BOOT; rr(g, -4.5, 8, 9, 9, 2); g.fill(); rr(g, -3, 13, 11, 4, 2); g.fill();
    g.fillStyle = dark ? '#a8977c' : FUR; g.beginPath(); g.ellipse(0, 9, 5.5, 2.6, 0, 0, 7); g.fill();
    g.restore();
  };
  const arm = (sx, a, dark, hammer) => {
    g.save(); g.translate(sx, -32); g.rotate(a);
    g.fillStyle = dark ? SKD : SK;
    g.beginPath(); g.ellipse(0, 5, 5.2, 6.5, 0, 0, 7); g.fill();
    rr(g, -3.6, 4, 7.2, 13, 3.5); g.fill();
    g.fillStyle = dark ? '#3e2816' : BELT; rr(g, -4, 10, 8, 5, 1.5); g.fill();
    g.fillStyle = dark ? '#8a6a2a' : GOLD; g.fillRect(-4, 12, 8, 1.2);
    g.fillStyle = dark ? SKD : SK; g.beginPath(); g.arc(0, 18, 3.8, 0, 7); g.fill();
    if (hammer) { g.translate(0, 19); g.rotate(Math.PI); drawMjolnir(g, 0, -2, .62, 0, o.glow || 0); }
    g.restore();
  };
  leg(-4, -legA, true);
  arm(-6, armB, true, false);
  // torso
  g.fillStyle = TUN;
  g.beginPath(); g.moveTo(-12, -35); g.lineTo(13, -35); g.lineTo(11, -17); g.lineTo(-10, -17); g.closePath(); g.fill();
  g.fillStyle = TUND; g.fillRect(-10, -24, 21, 4);
  g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(4, -30, 6, 3.5, 0, 0, 7); g.fill();
  g.fillStyle = FUR; g.beginPath(); g.ellipse(-2, -35, 10, 3.2, 0, 0, 7); g.fill();
  g.fillStyle = BELT; g.fillRect(-11, -20, 23, 4);
  g.fillStyle = GOLD; g.fillRect(4, -20.5, 5, 5);
  leg(4, legA, false);
  // head
  g.fillStyle = SK; g.beginPath(); g.ellipse(3, -43, 7.6, 8.2, 0, 0, 7); g.fill();
  g.fillStyle = SKD; g.beginPath(); g.arc(10.5, -42.5, 2.2, 0, 7); g.fill();
  // eye & brow
  g.fillStyle = '#1b1b1b'; g.beginPath(); g.ellipse(7, -44.5, 1.3, 1.8, 0, 0, 7); g.fill();
  g.strokeStyle = HAIRD; g.lineWidth = 2.2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(4, -47.5); g.lineTo(10, -46.5); g.stroke();
  // huge beard with braids
  g.fillStyle = HAIR;
  g.beginPath(); g.moveTo(-2, -44); g.quadraticCurveTo(-5, -30, 0, -22); g.quadraticCurveTo(6, -18, 11, -24);
  g.quadraticCurveTo(14, -32, 12, -40); g.quadraticCurveTo(7, -37, 3, -39); g.closePath(); g.fill();
  g.strokeStyle = HAIRD; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(2, -36); g.quadraticCurveTo(1, -29, 3, -24); g.moveTo(7, -36); g.quadraticCurveTo(7, -29, 8, -25); g.stroke();
  g.fillStyle = HAIR; rr(g, 1, -24, 3.5, 8, 1.5); g.fill(); rr(g, 6.5, -25, 3.5, 8, 1.5); g.fill();
  g.fillStyle = GOLD; g.fillRect(1, -21, 3.5, 2); g.fillRect(6.5, -22, 3.5, 2);
  g.fillStyle = HAIRL; g.beginPath(); g.ellipse(8, -39.2, 5, 2, -.15, 0, 7); g.fill();
  // helmet with wings
  g.fillStyle = STEEL; g.beginPath(); g.arc(2.5, -47, 9, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = STEELD; g.fillRect(-6.5, -48.5, 18, 3.2); g.fillRect(8.5, -48, 2.6, 7);
  g.fillStyle = GOLD; g.beginPath(); g.arc(-3, -47, 1, 0, 7); g.arc(2.5, -47, 1, 0, 7); g.fill();
  const wf = Math.sin(t * 8) * .08 * (run + .3);
  g.save(); g.translate(-4, -51); g.rotate(-.5 + wf);
  g.fillStyle = '#f4f2ea';
  for (let i = 0; i < 3; i++) { g.beginPath(); g.ellipse(-4 - i * 2, -3 + i * 3, 9 - i * 1.5, 2.6, -.35 + i * .25, 0, 7); g.fill(); }
  g.restore();
  arm(6, armA, false, !!o.hammer);
  g.restore();
}

function drawLoki(g, x, y, o) {
  g.save(); g.translate(x, y); if (o.face < 0) g.scale(-1, 1);
  const t = o.t, run = o.run || 0;
  const legA = Math.sin(t * 16) * .7 * run;
  const tug = o.tug ? Math.sin(t * 30) * 1.5 : 0;
  g.translate(tug, 0);
  // cape
  g.fillStyle = '#1e4a2a';
  g.beginPath(); g.moveTo(-6, -38); g.quadraticCurveTo(-18, -20 + Math.sin(t * 7) * 3, -16, 0); g.lineTo(-2, -4); g.closePath(); g.fill();
  const leg = (hx, a) => { g.save(); g.translate(hx, -18); g.rotate(a); g.fillStyle = '#23312a'; rr(g, -3.5, 0, 7, 18, 3); g.fill(); g.fillStyle = '#1a1a1a'; rr(g, -3, 14, 9, 4, 2); g.fill(); g.restore(); };
  leg(-3, -legA); leg(3, legA);
  g.fillStyle = '#2f7a42';
  g.beginPath(); g.moveTo(-8, -38); g.lineTo(9, -38); g.lineTo(8, -17); g.lineTo(-7, -17); g.closePath(); g.fill();
  g.fillStyle = '#d9b44a'; g.fillRect(-8, -21, 16, 3);
  // arm
  g.save(); g.translate(4, -35); g.rotate(o.reach ? -1.4 : (o.tug ? -1.9 : -Math.sin(t * 16) * .8 * run));
  g.fillStyle = '#2f7a42'; rr(g, -2.8, 0, 5.6, 15, 2.5); g.fill();
  g.fillStyle = '#e9d6c0'; g.beginPath(); g.arc(0, 16, 3, 0, 7); g.fill();
  if (o.hammer) { g.translate(0, 17); g.rotate(Math.PI); drawMjolnir(g, 0, -2, .55, 0, .3); }
  g.restore();
  // head
  g.fillStyle = '#e9d6c0'; g.beginPath(); g.ellipse(2, -45, 6.5, 7.5, 0, 0, 7); g.fill();
  g.fillStyle = '#141414';

  g.restore();
}

function drawWolf(g, e, t) {
  g.save(); g.translate(e.x + e.w / 2, e.y + e.h); if (e.dir < 0) g.scale(-1, 1);
  if (e.dead === 'squash') g.scale(1.1, .35);
  if (e.dead === 'fall') { g.translate(0, -e.h / 2); g.scale(1, -1); g.translate(0, e.h / 2); }
  const dark = e.dark;
  const C = dark ? '#4b505c' : '#8f939b', CD = dark ? '#2e323b' : '#62666f', BELLY = dark ? '#8a8a8a' : '#d4cfc4';
  const ph = e.ph, run = e.onGround ? 1 : 0;
  const la = Math.sin(ph) * .6 * run, lb = Math.sin(ph + Math.PI) * .6 * run;
  const leg = (x, a, c) => { g.save(); g.translate(x, -12); g.rotate(a); g.fillStyle = c; rr(g, -2.5, 0, 5, 12, 2); g.fill(); g.restore(); };
  leg(-11, lb, CD); leg(10, la, CD);
  // tail
  g.strokeStyle = C; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-15, -19); g.quadraticCurveTo(-25, -22 + Math.sin(t * 8) * 2, -28, -14 + Math.sin(t * 8) * 3); g.stroke();
  // body
  g.fillStyle = C; g.beginPath(); g.ellipse(0, -18, 17, 9, 0, 0, 7); g.fill();
  g.fillStyle = BELLY; g.beginPath(); g.ellipse(2, -13, 12, 4, 0, 0, 7); g.fill();
  g.fillStyle = CD; g.beginPath(); g.moveTo(-15, -22); for (let i = 0; i < 6; i++) g.lineTo(-12 + i * 5, -28 + (i % 2) * 3); g.lineTo(14, -22); g.closePath(); g.fill();
  leg(-7, la, C); leg(13, lb, C);
  // head
  g.fillStyle = C; g.beginPath(); g.ellipse(15, -25, 8, 7, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(18, -28); g.lineTo(30, -23); g.lineTo(28, -19); g.lineTo(17, -19); g.closePath(); g.fill();
  g.fillStyle = CD; g.beginPath(); g.moveTo(10, -30); g.lineTo(13, -38); g.lineTo(17, -30); g.closePath(); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(29, -22.5, 1.8, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(22, -19); g.lineTo(23, -16.5); g.lineTo(24, -19); g.moveTo(26, -19); g.lineTo(27, -16.8); g.lineTo(28, -19); g.fill();
  g.fillStyle = e.dead ? '#555' : '#ffd23a'; g.beginPath(); g.ellipse(18.5, -27, 1.8, 1.3, 0, 0, 7); g.fill();
  g.restore();
}

function drawRaven(g, e, t) {
  g.save(); g.translate(e.x + e.w / 2, e.y + e.h / 2); if (e.face < 0) g.scale(-1, 1);
  if (e.dead === 'fall') g.scale(1, -1);
  if (e.dead === 'squash') g.scale(1.1, .45);
  const flap = Math.sin(t * (e.mode === 'dive' ? 8 : 16) + e.ph);
  g.fillStyle = '#16151b';
  g.beginPath(); g.moveTo(-14, 0); g.lineTo(-24, -3); g.lineTo(-22, 4); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(0, 0, 14, 7, 0, 0, 7); g.fill();
  g.beginPath(); g.arc(12, -4, 6, 0, 7); g.fill();
  g.fillStyle = '#6e6a63'; g.beginPath(); g.moveTo(16, -5); g.lineTo(25, -2); g.lineTo(16, -1); g.closePath(); g.fill();
  g.fillStyle = e.mode === 'warn' ? '#ff5a3a' : '#e8e2d0'; g.beginPath(); g.arc(13.5, -5.5, 1.5, 0, 7); g.fill();
  g.fillStyle = '#26242d';
  g.beginPath(); g.moveTo(-4, -2); g.quadraticCurveTo(-4, -14 - flap * 12, -16, -22 * flap - 2); g.lineTo(6, -3); g.closePath(); g.fill();
  g.restore();
}

function drawSheep(g, e, t) {
  g.save(); g.translate(e.x + e.w / 2, e.y + e.h); if (e.dir < 0) g.scale(-1, 1);
  const sq = e.squish > 0 ? 1 - e.squish * .5 : 1;
  g.scale(1 + (1 - sq) * .5, sq);
  const burnt = e.burnt > 0;
  const W = burnt ? '#3a3531' : '#f4f1ea', WD = burnt ? '#231f1c' : '#d8d1c2';
  const ph = e.ph;
  g.fillStyle = '#2f2622';
  for (const [lx, o] of [[-10, 0], [-4, Math.PI], [5, 0], [11, Math.PI]]) {
    const a = e.moving ? Math.sin(ph + o) * .4 : 0;
    g.save(); g.translate(lx, -10); g.rotate(a); g.fillRect(-1.8, 0, 3.6, 10); g.restore();
  }
  g.fillStyle = WD; g.beginPath(); g.ellipse(0, -18, 17, 11, 0, 0, 7); g.fill();
  g.fillStyle = W;
  for (const [cx, cy, r] of [[-11, -18, 7], [-4, -24, 8], [5, -24, 8], [12, -19, 7], [0, -15, 9], [-8, -13, 6], [8, -13, 6]]) { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); }
  const graze = e.graze > 0 ? 5 : 0;
  g.fillStyle = '#3a2f29'; g.beginPath(); g.ellipse(18, -20 + graze, 5.5, 7, .5, 0, 7); g.fill();
  g.fillStyle = burnt ? '#1a1715' : '#d8b98a';
  g.beginPath(); g.ellipse(13, -24 + graze, 4, 2, -.4, 0, 7); g.fill();
  g.strokeStyle = '#c8b58c'; g.lineWidth = 2; g.beginPath(); g.arc(16, -24 + graze, 3.5, Math.PI, Math.PI * 2.2); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(19.5, -22 + graze, 1.6, 0, 7); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(20, -22 + graze, .9, 0, 7); g.fill();
  g.restore();
}

function drawCoin(g, x, y, t, spin) {
  const w = Math.abs(Math.cos(spin)) * 11 + 1.5;
  g.fillStyle = '#a8741c'; g.beginPath(); g.ellipse(x, y, w + 1, 12, 0, 0, 7); g.fill();
  g.fillStyle = '#f2c14e'; g.beginPath(); g.ellipse(x, y, w, 11, 0, 0, 7); g.fill();
  if (w > 7) { g.save(); g.translate(x - w * .25, y - 7); g.scale(w / 11, 1); drawRune(g, 'f', 0, 0, 14, '#a8741c', 2); g.restore(); }
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(x - w * .45, y - 5, w * .18, 3, 0, 0, 7); g.fill();
}

function drawMead(g, x, y, t) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#e6d6b2';
  g.beginPath(); g.moveTo(-12, -10); g.quadraticCurveTo(-10, 6, 10, 10); g.quadraticCurveTo(0, 2, 2, -10); g.closePath(); g.fill();
  g.strokeStyle = '#a58a5a'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-8, -2); g.lineTo(0, -4); g.moveTo(-5, 4); g.lineTo(3, 1); g.stroke();
  g.fillStyle = '#e0a93b'; g.fillRect(-13, -12, 16, 3.5);
  g.fillStyle = '#fff8e8';
  for (const [cx, r] of [[-10, 3.5], [-5, 4.2], [0, 3.4]]) { g.beginPath(); g.arc(cx, -13 - Math.sin(t * 5 + cx) * .8, r, 0, 7); g.fill(); }
  g.restore();
}

/* ============================================================
   Parallax background layers (pre-rendered, tiled)
   ============================================================ */
const LAYER_W = 2048;
function makeLayers(th, seed) {
  const R = rng(seed);
  const mk = () => { const c = document.createElement('canvas'); c.width = LAYER_W; c.height = VH; return c; };
  const far = mk(), mid = mk(), near = mk();
  let g = far.getContext('2d');
  const wrap3 = (x, fn) => { for (const o of [-LAYER_W, 0, LAYER_W]) fn(x + o); };
  if (th.stars) {
    for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${.3 + R() * .6})`; g.fillRect(R() * LAYER_W, R() * 300, R() < .1 ? 2 : 1.2, R() < .1 ? 2 : 1.2); }
  }
  if (th.bifrost) {
    const cols = ['#ff5a5a', '#ffa64a', '#ffe35a', '#6fe07a', '#5ab8ff', '#8a6aff'];
    wrap3(1200, x => cols.forEach((c, i) => {
      g.strokeStyle = c; g.globalAlpha = .38; g.lineWidth = 10;
      g.beginPath(); g.arc(x, 520, 520 - i * 10, Math.PI * 1.08, Math.PI * 1.62); g.stroke();
    }));
    g.globalAlpha = 1;
  }
  if (th.decor === 'giants') {
    for (let k = 0; k < 3; k++) {
      const gx = 300 + k * 700 + R() * 120, gh = 330 + R() * 60;
      wrap3(gx, x => {
        g.fillStyle = '#8397ab';
        const base = 470, top = base - gh;
        g.beginPath(); g.ellipse(x, top + 30, 30, 34, 0, 0, 7); g.fill();
        g.beginPath(); g.moveTo(x - 90, top + 80); g.quadraticCurveTo(x, top + 50, x + 90, top + 80);
        g.lineTo(x + 70, base); g.lineTo(x - 70, base); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(x - 90, top + 80); g.lineTo(x - 130, top + 230); g.lineTo(x - 100, top + 240); g.lineTo(x - 72, top + 110); g.fill();
        g.beginPath(); g.moveTo(x + 90, top + 80); g.lineTo(x + 125, top + 220); g.lineTo(x + 95, top + 232); g.lineTo(x + 72, top + 110); g.fill();
        g.fillStyle = '#d6f4ff';
        g.beginPath(); g.ellipse(x - 11, top + 26, 5, 2.5, 0, 0, 7); g.ellipse(x + 11, top + 26, 5, 2.5, 0, 0, 7); g.fill();
      });
    }
  }
  // mountains
  const nPeaks = th.decor === 'peaks' ? 20 : 14;
  for (let k = 0; k < nPeaks; k++) {
    const px = R() * LAYER_W, h = (th.decor === 'peaks' ? 230 : 160) + R() * 200, w = (th.decor === 'peaks' ? 90 : 150) + R() * 150;
    wrap3(px, x => {
      const base = 480, top = base - h;
      g.fillStyle = th.far; g.beginPath(); g.moveTo(x - w, base); g.lineTo(x - w * .15, top + 8); g.lineTo(x, top); g.lineTo(x + w * .2, top + 14); g.lineTo(x + w, base); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.08)'; g.beginPath(); g.moveTo(x, top); g.lineTo(x + w * .2, top + 14); g.lineTo(x + w, base); g.lineTo(x + w * .1, base); g.closePath(); g.fill();
      if (th.farSnow) {
        const sh = h * .3;
        g.fillStyle = th.farSnow; g.beginPath();
        g.moveTo(x - w * .15 * (sh / h) * 6.6, top + sh);
        g.lineTo(x - w * .15, top + 8); g.lineTo(x, top); g.lineTo(x + w * .2, top + 14);
        g.lineTo(x + w * .3, top + sh); g.lineTo(x + w * .12, top + sh * .75); g.lineTo(x, top + sh * 1.05); g.lineTo(x - w * .12, top + sh * .7);
        g.closePath(); g.fill();
      }
    });
  }
  if (th.farWater) {
    g.fillStyle = th.farWater; g.fillRect(0, 440, LAYER_W, VH - 440);
    g.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 60; i++) g.fillRect(R() * LAYER_W, 446 + R() * 60, 14 + R() * 30, 1.5);
  }
  // mid layer: hills + silhouettes
  g = mid.getContext('2d');
  const ph = [R() * 6, R() * 6, R() * 6];
  const hillY = x => (th.farWater ? 470 : 430) + Math.sin(x / LAYER_W * Math.PI * 2 * 2 + ph[0]) * 26 + Math.sin(x / LAYER_W * Math.PI * 2 * 5 + ph[1]) * 14 + Math.sin(x / LAYER_W * Math.PI * 2 * 11 + ph[2]) * 6;
  g.fillStyle = th.mid; g.beginPath(); g.moveTo(0, VH);
  for (let x = 0; x <= LAYER_W; x += 8) g.lineTo(x, hillY(x));
  g.lineTo(LAYER_W, VH); g.closePath(); g.fill();
  const sil = th.midDark;
  if (th.decor === 'longhouse') {
    for (let k = 0; k < 4; k++) {
      const hx = 200 + k * 500 + R() * 140, s = .8 + R() * .5;
      wrap3(hx, x => {
        const b = hillY(((x % LAYER_W) + LAYER_W) % LAYER_W) + 6;
        g.fillStyle = sil; g.fillRect(x - 58 * s, b - 26 * s, 116 * s, 26 * s);
        g.beginPath(); g.moveTo(x - 68 * s, b - 22 * s); g.lineTo(x - 54 * s, b - 50 * s);
        g.quadraticCurveTo(x, b - 58 * s, x + 54 * s, b - 50 * s); g.lineTo(x + 68 * s, b - 22 * s); g.closePath(); g.fill();
        g.strokeStyle = sil; g.lineWidth = 3 * s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x - 54 * s, b - 50 * s); g.quadraticCurveTo(x - 66 * s, b - 62 * s, x - 58 * s, b - 68 * s);
        g.moveTo(x + 54 * s, b - 50 * s); g.quadraticCurveTo(x + 66 * s, b - 62 * s, x + 58 * s, b - 68 * s); g.stroke();
        g.fillStyle = 'rgba(255,200,120,.55)'; g.fillRect(x - 6 * s, b - 16 * s, 12 * s, 16 * s);
        g.fillStyle = 'rgba(255,255,255,.18)';
        for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(x + 30 * s + i * 6, b - 64 * s - i * 16, 7 + i * 3, 0, 7); g.fill(); }
      });
    }
  } else if (th.decor === 'valhalla') {
    wrap3(900, x => {
      const b = hillY(900) + 10;
      g.fillStyle = sil; g.fillRect(x - 170, b - 70, 340, 70);
      for (let i = 0; i < 9; i++) { g.fillStyle = '#3f2f24'; g.fillRect(x - 160 + i * 40, b - 70, 8, 70); }
      g.fillStyle = sil; g.beginPath(); g.moveTo(x - 200, b - 64); g.lineTo(x, b - 150); g.lineTo(x + 200, b - 64); g.closePath(); g.fill();
      g.fillStyle = '#e0b54c';
      for (let r = 0; r < 5; r++) for (let i = -r; i <= r; i++) { g.beginPath(); g.arc(x + i * 34, b - 140 + r * 18, 9, 0, 7); g.fill(); }
      g.strokeStyle = sil; g.lineWidth = 4;
      g.beginPath(); g.moveTo(x - 30, b - 150); g.lineTo(x - 50, b - 190); g.moveTo(x + 30, b - 150); g.lineTo(x + 50, b - 190); g.stroke();
    });
  } else if (th.decor === 'forest') {
    for (let i = 0; i < 70; i++) {
      const tx = R() * LAYER_W, w = 8 + R() * 14;
      wrap3(tx, x => { g.fillStyle = sil; g.fillRect(x - w / 2, 0, w, VH); });
    }
  } else if (th.decor === 'peaks') {
    for (let i = 0; i < 12; i++) {
      const tx = R() * LAYER_W, h = 120 + R() * 140;
      wrap3(tx, x => { const b = hillY(((x % LAYER_W) + LAYER_W) % LAYER_W) + 10; g.fillStyle = sil; g.beginPath(); g.moveTo(x - 26, b); g.lineTo(x - 4, b - h); g.lineTo(x + 6, b - h + 20); g.lineTo(x + 26, b); g.closePath(); g.fill(); });
    }
  }
  // near layer: trees
  g = near.getContext('2d');
  const nTrees = th.tree === 'dead' ? 34 : 46;
  for (let i = 0; i < nTrees; i++) {
    const tx = R() * LAYER_W, h = 90 + R() * 120, base = 520 + R() * 30;
    wrap3(tx, x => {
      if (th.tree === 'pine' || th.tree === 'snowpine') {
        g.fillStyle = th.near; g.fillRect(x - 3, base - 20, 6, 20);
        for (let k = 0; k < 4; k++) {
          const ty = base - 14 - k * h * .22, w = h * (.34 - k * .06);
          g.fillStyle = th.near; g.beginPath(); g.moveTo(x - w, ty); g.lineTo(x, ty - h * .34); g.lineTo(x + w, ty); g.closePath(); g.fill();
          if (th.tree === 'snowpine') { g.fillStyle = 'rgba(240,246,252,.75)'; g.beginPath(); g.moveTo(x - w * .5, ty - h * .17); g.lineTo(x, ty - h * .34); g.lineTo(x + w * .45, ty - h * .18); g.closePath(); g.fill(); }
        }
      } else if (th.tree === 'dead') {
        g.strokeStyle = th.near; g.lineCap = 'round';
        g.lineWidth = 9; g.beginPath(); g.moveTo(x, base); g.lineTo(x + 4, base - h); g.stroke();
        g.lineWidth = 4;
        for (let k = 0; k < 4; k++) { const by = base - h * (.4 + k * .15), d = (k % 2 ? 1 : -1); g.beginPath(); g.moveTo(x + 2, by); g.quadraticCurveTo(x + d * 20, by - 10, x + d * 36, by - 30); g.stroke(); }
      } else if (th.tree === 'goldtree') {
        g.fillStyle = th.near; g.fillRect(x - 4, base - h * .6, 8, h * .6);
        g.fillStyle = 'rgba(232,194,90,.55)';
        for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + (k - 2) * 12, base - h * .6 - (k % 2) * 14, 22, 0, 7); g.fill(); }
      }
    });
  }
  return { far, mid, near };
}

/* ============================================================
   Tiles (pre-rendered per realm)
   ============================================================ */
function makeTiles(th) {
  const R = rng(1234);
  const mk = () => { const c = document.createElement('canvas'); c.width = TS; c.height = TS; return c; };
  const inner = mk(); let g = inner.getContext('2d');
  if (th.ground === 'marble') {
    g.fillStyle = th.dirt; g.fillRect(0, 0, TS, TS);
    g.strokeStyle = th.dirtDark; g.lineWidth = 2; g.strokeRect(1, 1, TS - 2, TS - 2);
    g.strokeStyle = 'rgba(160,140,110,.35)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(6, 10); g.quadraticCurveTo(20, 20, 16, 38); g.moveTo(30, 6); g.quadraticCurveTo(38, 22, 44, 30); g.stroke();
  } else {
    g.fillStyle = th.dirt; g.fillRect(0, 0, TS, TS);
    for (let i = 0; i < 16; i++) { g.fillStyle = th.dirtDark; g.beginPath(); g.ellipse(R() * TS, R() * TS, 1 + R() * 3, 1 + R() * 2, 0, 0, 7); g.fill(); }
    for (let i = 0; i < 3; i++) { g.fillStyle = th.stoneDark; g.beginPath(); g.ellipse(R() * TS, R() * TS, 3 + R() * 4, 2 + R() * 3, 0, 0, 7); g.fill(); }
  }
  const top = mk(); g = top.getContext('2d'); g.drawImage(inner, 0, 0);
  if (th.ground === 'grass' || th.ground === 'moss') {
    g.fillStyle = th.grassDark; g.fillRect(0, 0, TS, 15);
    g.beginPath(); for (let x = 0; x <= TS; x += 6) { g.lineTo(x, 15); g.lineTo(x + 3, 19 + R() * 4); } g.lineTo(TS, 15); g.fill();
    g.fillStyle = th.grass; g.fillRect(0, 0, TS, 11);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0, 0, TS, 3);
    if (th.ground === 'moss') { g.fillStyle = '#c24a3a'; g.beginPath(); g.arc(12, 9, 2, 0, 7); g.arc(36, 8, 1.6, 0, 7); g.fill(); }
  } else if (th.ground === 'snow') {
    g.fillStyle = th.grassDark; g.fillRect(0, 0, TS, 16);
    g.fillStyle = th.grass; g.fillRect(0, 0, TS, 11);
    for (let x = 4; x < TS; x += 11) { g.beginPath(); g.arc(x, 12, 5, 0, Math.PI); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(0, 0, TS, 3);
  } else if (th.ground === 'rock') {
    g.fillStyle = th.stoneDark; g.fillRect(0, 0, TS, 12);
    g.fillStyle = th.grass; g.fillRect(0, 0, TS, 4);
    g.fillStyle = th.grassDark; for (let x = 2; x < TS; x += 7) g.fillRect(x, 4, 2, 3 + R() * 5);
  } else if (th.ground === 'marble') {
    g.fillStyle = th.grassDark; g.fillRect(0, 0, TS, 9);
    g.fillStyle = th.grass; g.fillRect(0, 0, TS, 6);
    g.fillStyle = '#fff3c0'; g.fillRect(0, 0, TS, 2);

  }
  const brick = [];
  for (let v = 0; v < 4; v++) {
    const c = mk(); g = c.getContext('2d');
    g.fillStyle = th.stoneDark; g.fillRect(0, 0, TS, TS);
    g.fillStyle = th.stone; g.fillRect(2, 2, TS - 4, TS - 4);
    g.fillStyle = th.stoneLight; g.fillRect(2, 2, TS - 4, 4); g.fillRect(2, 2, 4, TS - 4);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(2, TS - 6, TS - 4, 4); g.fillRect(TS - 6, 2, 4, TS - 4);
    const key = ['f', 'th', 'a', 'r', 'k', 'z', 'o', 'e', 'm', 'd', 's', 't'][(v * 5 + 3) % 12];
    drawRune(g, key, 17, 10, 26, 'rgba(255,255,255,.28)', 3.4);
    drawRune(g, key, 16, 9, 26, th.stoneDark, 3);
    brick.push(c);
  }
  const q = mk(); g = q.getContext('2d');
  g.fillStyle = '#3a2412'; g.fillRect(0, 0, TS, TS);
  g.fillStyle = '#7a4c22'; g.fillRect(3, 3, TS - 6, TS - 6);
  g.fillStyle = '#8f5c2c'; for (let y = 6; y < TS - 6; y += 9) g.fillRect(3, y, TS - 6, 4);
  g.fillStyle = '#4b4b52'; g.fillRect(0, 0, 10, 10); g.fillRect(TS - 10, 0, 10, 10); g.fillRect(0, TS - 10, 10, 10); g.fillRect(TS - 10, TS - 10, 10, 10);
  g.fillStyle = '#9ea2aa'; for (const [x, y] of [[5, 5], [TS - 5, 5], [5, TS - 5], [TS - 5, TS - 5]]) { g.beginPath(); g.arc(x, y, 1.8, 0, 7); g.fill(); }
  const used = mk(); g = used.getContext('2d');
  g.fillStyle = '#2c2520'; g.fillRect(0, 0, TS, TS);
  g.fillStyle = '#4c3f33'; g.fillRect(3, 3, TS - 6, TS - 6);

  g.fillStyle = '#4a2f18'; g.fillRect(0, 0, TS, 16);
  g.fillStyle = '#8a5a2e'; g.fillRect(0, 1, TS, 12);
  g.fillStyle = '#a26f3c'; g.fillRect(0, 1, TS, 3);

  g.fillStyle = '#c8b27a'; g.fillRect(4, 0, 5, 16); g.fillRect(TS - 9, 0, 5, 16);

  for (let i = 0; i < 3; i++) {
    const x = 8 + i * 16;
    if (th.spike === 'stake') {
      g.fillStyle = '#6b4424'; g.beginPath(); g.moveTo(x - 6, TS); g.lineTo(x - 6, 22); g.lineTo(x, 8); g.lineTo(x + 6, 22); g.lineTo(x + 6, TS); g.closePath(); g.fill();

    } else if (th.spike === 'ice') {
      g.fillStyle = '#9fd3f2'; g.beginPath(); g.moveTo(x - 7, TS); g.lineTo(x, 6 + (i % 2) * 8); g.lineTo(x + 7, TS); g.closePath(); g.fill();

      g.fillStyle = '#e8c25a'; g.beginPath(); g.moveTo(x - 5, 22); g.lineTo(x, 4); g.lineTo(x + 5, 22); g.closePath(); g.fill();

  }
  return { inner, top, brick, q, used, plank, spike };
}

function buildLevel(idx) {
  const def = LEVELS[idx];
  const w = def.w;
  const L = { idx, def, w, grid: new Uint8Array(w * ROWS), bump: new Float32Array(w * ROWS), ents: [], storms: [], checks: [], signs: [], decor: [], start: null, goal: null, theme: THEMES[def.theme] };
  const set = (x, y, t) => { if (x < 0 || x >= w || y < 1 || y > ROWS) return; L.grid[(ROWS - y) * w + x] = t; };
  const standY = y => (ROWS - y + 1) * TS;
  const hunter = idx >= 2;
  const b = {
    floor(x0, x1) { this.hill(x0, x1, 2); },
    hill(x0, x1, h) { for (let x = x0; x <= x1; x++) for (let y = 1; y <= h; y++) set(x, y, T.GROUND); },
    brick(x, y, n = 1) { for (let i = 0; i < n; i++) set(x + i, y, T.BRICK); },
    q(x, y, kind) { set(x, y, kind === 'mead' ? T.QMEAD : T.QCOIN); },
    plank(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y, T.PLANK); },
    spikes(x0, x1, y = 3) { for (let x = x0; x <= x1; x++) set(x, y, T.SPIKE); },
    stairs(x, n, dir = 1) {
      for (let i = 0; i < n; i++) { const hgt = dir > 0 ? i + 1 : n - i; for (let j = 0; j < hgt; j++) set(x + i, 3 + j, T.BRICK); }
    },
    coins(x, y, n = 1) { for (let i = 0; i < n; i++) L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - y) * TS + 12, w: 24, h: 24, ph: (x + i) * .7 }); },
    arc(x, y, n) {
      for (let i = 0; i < n; i++) {
        const k = n > 1 ? i / (n - 1) : .5, hy = y + Math.sin(k * Math.PI) * 1.5;
        L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - hy) * TS + 12, w: 24, h: 24, ph: i * .7 });
      }
    },
    wolf(x, leaper) {
      L.ents.push({ type: 'wolf', x: x * TS + 5, y: standY(3) - 28, w: 38, h: 28, vx: 0, vy: 0, dir: -1, speed: 70 + idx * 12, ph: x, dark: idx >= 2, leaper: !!leaper && hunter, cd: 1 + (x % 3) * .5 });
    },
    raven(x, y) {
      const cy = (ROWS - y) * TS + 10;
      L.ents.push({ type: 'raven', x: x * TS, y: cy, x0: x * TS, y0: cy, w: 34, h: 22, t: x, ph: x, face: -1, mode: 'patrol', mt: 0, cd: 1.5 });
    },
    sheep(x, range = 2) {
      L.ents.push({ type: 'sheep', x: x * TS + 6, y: standY(3) - 32, w: 36, h: 32, vx: 0, vy: 0, dir: 1, minX: (x - range) * TS, maxX: (x + range + 1) * TS, ph: 0, graze: 0, squish: 0, burnt: 0, moving: true });
    },
    sign(x, text) { L.signs.push({ x: x * TS + TS / 2, y: standY(3), text, rune: RUNE_KEYS[x % RUNE_KEYS.length] }); },
    check(x) { L.checks.push({ x: x * TS + TS / 2, y: standY(3), on: false, wave: 0 }); },
    start(x) { L.start = { x: x * TS + 10, y: standY(3) - 44 }; },
    goal(x) { L.goal = { x: x * TS + TS / 2, y: standY(3) }; },
    storm(x0, n, pattern, o) {
      L.storms.push({ x0: x0 * TS, n, slotW: TS * 2, pattern, interval: o.interval, pause: o.pause || 0, warn: o.warn || 1, t: .8, step: 0, strikes: [], mixI: 0, mixPat: 'sweepR', glow: 0, blobs: null, active: false });
    },
  };
  def.build(b);
  // stone pedestal for the hammer
  if (L.goal) { const gx = Math.floor(L.goal.x / TS); set(gx, 3, T.USED); L.goal.y -= TS; }
  // cloud blobs over each storm
  L.storms.forEach((s, i) => {
    const R = rng(idx * 100 + i + 7); s.blobs = [];
    for (let x = s.x0 - 70; x < s.x0 + s.n * s.slotW + 70; x += 30) s.blobs.push({ x, y: 18 + R() * 34, r: 38 + R() * 30 });
    s.drops = []; for (let k = 0; k < s.n * 8; k++) s.drops.push({ x: R(), o: R() });
  });
  // procedural props on the ground
  const R = rng(idx * 31 + 5), props = L.theme.props;
  for (let x = 2; x < w - 2; x++) {
    for (let ty = 1; ty < ROWS; ty++) {
      if (L.grid[ty * w + x] === T.GROUND && L.grid[(ty - 1) * w + x] === T.EMPTY) {
        if (R() < .22) L.decor.push({ x: x * TS + 8 + R() * 32, y: ty * TS, type: props[Math.floor(R() * props.length)], s: .8 + R() * .4, r: R() });
        break;
      }
    }
  }
  return L;
}

   Sound: synthesized with WebAudio (no files)
   ============================================================ */
const Sound = { ctx: null, on: true, master: null, sfx: null, music: null, noise: null };
function loadPref() { try { return localStorage.getItem('mjolnir.sound') !== 'off'; } catch (e) { return true; } }
Sound.on = loadPref();
function unlockAudio() {
  if (Sound.ctx) { if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  let c; try { c = new AC(); } catch (e) { return; }
  Sound.ctx = c;

   ============================================================ */

  else if (G.state === 'title') { cam.x = (Math.sin(G.t * .12) + 1) / 2 * Math.max(0, 36 * TS - VW); updateEnts(dt); }
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }

function handleMenus() {
  if (G.state === 'title') {
    const n = G.unlocked > 0 ? 2 : 1;
    if (input.up) G.sel = (G.sel + n - 1) % n;
    if (input.down) G.sel = (G.sel + 1) % n;
    if (input.confirm) { if (G.sel === 1 && G.unlocked > 0) startGame(G.unlocked); else startGame(0); }
  } else if (G.state === 'intro') {
    if ((input.confirm && G.st > .4) || G.st > 4.5) { G.state = 'play'; }
  } else if (G.state === 'complete') {
    if (input.confirm && G.st > .8) { beginLevel(G.level + 1); }
  } else if (G.state === 'gameover') {
    if (input.confirm && G.st > .8) { G.score = G.lvlScore; G.coins = G.lvlCoins; G.lives = 3; beginLevel(G.level); }
  } else if (G.state === 'victory') {
    if (input.confirm && G.st > 1.5) { G.state = 'title'; G.sel = 0; loadLevel(0, false); }
  }
  input.confirm = false; input.up = false; input.down = false;
}

  else if (w === 'rain') { g.strokeStyle = 'rgba(170,200,240,.35)'; g.lineWidth = 1.3; g.beginPath(); for (const f of weather) { const x = f.x % VW; g.moveTo(x, f.y); g.lineTo(x - 5, f.y + 16); } g.stroke(); }
  else if (w === 'fireflies') { for (const f of weather) { const a = .3 + Math.sin(G.t * 3 + f.p) * .3; if (a <= 0) continue; g.fillStyle = `rgba(210,255,120,${a})`; g.beginPath(); g.arc(f.x % VW, f.y, 2.2, 0, 7); g.fill(); } }
  else if (w === 'motes') { g.fillStyle = 'rgba(255,230,150,.6)'; for (const f of weather) { g.beginPath(); g.arc(f.x % VW, f.y, 1.2 + f.s * 1.5, 0, 7); g.fill(); } }
  else if (w === 'leaves') { for (const f of weather) { g.fillStyle = f.s < .5 ? '#d9822b' : '#c9a93a'; g.save(); g.translate(f.x % VW, f.y); g.rotate(G.t * 2 + f.p); g.beginPath(); g.ellipse(0, 0, 4, 2, 0, 0, 7); g.fill(); g.restore(); } }
  if (G.flash > 0) { g.fillStyle = `rgba(230,240,255,${G.flash * .45})`; g.fillRect(0, 0, VW, VH); }
  const vg = g.createRadialGradient(VW / 2, VH / 2, VH * .45, VW / 2, VH / 2, VW * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
}

/* ---------- HUD & screens ---------- */
function txt(g, s, x, y, size, color, align = 'center', font = BODY, weight = 800, stroke = 'rgba(12,10,8,.85)', sw = 5) {
  g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = sw; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function drawHUD(g) {
  g.fillStyle = 'rgba(14,18,26,.62)'; rr(g, 10, 10, 330, 46, 12); g.fill();
  g.strokeStyle = 'rgba(224,169,59,.6)'; g.lineWidth = 2; rr(g, 10, 10, 330, 46, 12); g.stroke();
  for (let i = 0; i < 3; i++) drawShield(g, 34 + i * 30, 33, 12, i < G.hearts, '#b4281f', '#efe3c6');
  // lives: little helmet
  g.save(); g.translate(135, 33);
  g.fillStyle = '#c9cfd6'; g.beginPath(); g.arc(0, 2, 9, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = '#f4f2ea'; g.beginPath(); g.ellipse(-11, -3, 7, 2.5, -.5, 0, 7); g.ellipse(11, -3, 7, 2.5, .5, 0, 7); g.fill();
  g.fillStyle = '#d4572a'; g.beginPath(); g.moveTo(-7, 3); g.quadraticCurveTo(0, 16, 7, 3); g.fill();
  g.restore();
  txt(g, '×' + G.lives, 152, 34, 18, '#f3e7c9', 'left');
  drawCoin(g, 202, 33, G.t, G.t * 2.5);
  txt(g, '×' + G.coins, 218, 34, 18, '#f3e7c9', 'left');
  txt(g, String(G.score).padStart(6, '0'), 330, 34, 18, '#ffe28a', 'right');
  if (VW > 760) {
    txt(g, LEVELS[G.level].name, VW / 2, 26, 22, '#f3e7c9', 'center', DISPLAY, 400);
    drawRuneText(g, LEVELS[G.level].name, VW / 2, 42, 11, 'rgba(224,169,59,.9)', 1.6);
  }
}
function panel(g, x, y, w, h) {
  g.fillStyle = 'rgba(14,18,26,.9)'; rr(g, x, y, w, h, 14); g.fill();
  g.strokeStyle = '#e0a93b'; g.lineWidth = 3; rr(g, x, y, w, h, 14); g.stroke();
  g.strokeStyle = 'rgba(224,169,59,.35)'; g.lineWidth = 1.5; rr(g, x + 8, y + 8, w - 16, h - 16, 9); g.stroke();
  drawKnotBand(g, x + 40, y + 20, w - 80, 'rgba(224,169,59,.55)', 4);
  drawKnotBand(g, x + 40, y + h - 20, w - 80, 'rgba(224,169,59,.55)', 4);
}
function button(g, x, y, w, h, label, sel, fn) {
  g.fillStyle = sel ? '#b4281f' : 'rgba(40,46,58,.9)'; rr(g, x, y, w, h, 10); g.fill();
  g.strokeStyle = sel ? '#ffe28a' : 'rgba(224,169,59,.7)'; g.lineWidth = 2.5; rr(g, x, y, w, h, 10); g.stroke();
  txt(g, label, x + w / 2, y + h / 2 + 1, 21, '#f3e7c9', 'center', BODY, 800, null);
  uiButtons.push({ x, y, w, h, fn });
}
function drawTitle(g) {
  g.fillStyle = 'rgba(8,10,16,.45)'; g.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  drawRuneText(g, 'mjolnir', cx, 42, 30, 'rgba(224,169,59,.95)', 3);
  const pulse = 1 + Math.sin(G.t * 2) * .015;
  g.save(); g.translate(cx, 150); g.scale(pulse, pulse);
  txt(g, 'MJÖLNIR', 0, 0, Math.min(96, VW / 8.5), '#f3e7c9', 'center', DISPLAY, 400, '#2a1206', 10);
  g.restore();
  txt(g, 'The Lost Hammer of Thor', cx, 214, 26, '#ffe28a', 'center', DISPLAY, 400, '#2a1206', 6);
  drawMjolnir(g, cx - Math.min(300, VW * .33), 160, 1.4, -.35, 1);
  drawValknut(g, cx + Math.min(300, VW * .33), 150, 70, '#e0a93b', 4);
  txt(g, 'Loki has stolen Mjölnir. Chase the trickster through five realms and take it back!', cx, 258, 19, '#f3e7c9');
  const bw = 290, bh = 50;
  button(g, cx - bw / 2, 292, bw, bh, 'Begin the Quest', G.sel === 0, () => startGame(0));
  if (G.unlocked > 0) button(g, cx - bw / 2, 352, bw, bh, 'Continue: ' + LEVELS[G.unlocked].name, G.sel === 1, () => startGame(G.unlocked));
  const touchUI = document.body.classList.contains('touch');
  txt(g, touchUI ? 'Use the buttons at the bottom: ◀ ▶ to run, JUMP to leap, RUN to sprint.' : '← → / A D run  ·  SPACE / W jump  ·  SHIFT sprint  ·  P pause  ·  M sound', cx, VH - 70, 17, 'rgba(243,231,201,.9)');
  txt(g, 'Stomp wolves and ravens · bounce on sheep · read the runes before the lightning strikes', cx, VH - 44, 16, 'rgba(255,226,138,.85)');
}
function drawIntro(g) {
  const d = LEVELS[G.level], a = clamp(G.st * 3, 0, 1);
  g.save(); g.globalAlpha = a;
  const w = Math.min(640, VW - 40), h = 250, x = (VW - w) / 2, y = 120;
  panel(g, x, y, w, h);
  txt(g, `Realm ${['I', 'II', 'III', 'IV', 'V'][G.level]} of V`, VW / 2, y + 48, 18, '#e0a93b', 'center', BODY, 800, null);
  txt(g, d.name, VW / 2, y + 92, 46, '#f3e7c9', 'center', DISPLAY, 400, '#2a1206', 6);
  drawRuneText(g, d.name, VW / 2, y + 122, 16, 'rgba(224,169,59,.9)', 2);
  txt(g, d.sub, VW / 2, y + 158, 20, '#ffe28a', 'center', BODY, 800, null);
  g.font = `500 18px ${BODY}`;
  wrapText(g, d.intro, w - 80).forEach((l, i) => txt(g, l, VW / 2, y + 190 + i * 22, 18, '#e9dcc0', 'center', BODY, 500, null));
  g.restore();
  if (G.st > .6) txt(g, 'Press JUMP to begin', VW / 2, y + h + 34, 18, `rgba(243,231,201,${.6 + Math.sin(G.t * 4) * .4})`);
}
function drawComplete(g) {
  const d = LEVELS[G.level], w = Math.min(600, VW - 40), h = 270, x = (VW - w) / 2, y = 110;
  panel(g, x, y, w, h);
  txt(g, 'Mjölnir slipped away!', VW / 2, y + 56, 36, '#f3e7c9', 'center', DISPLAY, 400, '#2a1206', 6);
  g.font = `500 19px ${BODY}`;
  wrapText(g, d.next, w - 80).forEach((l, i) => txt(g, l, VW / 2, y + 100 + i * 24, 19, '#e9dcc0', 'center', BODY, 500, null));
  txt(g, `${d.name} cleared`, VW / 2, y + 160, 20, '#e0a93b', 'center', BODY, 800, null);
  txt(g, `Coins ${G.coins}   ·   Score ${G.score}`, VW / 2, y + 192, 20, '#ffe28a', 'center', BODY, 800, null);
  if (G.st > .8) {
    button(g, VW / 2 - 130, y + h - 60, 260, 44, 'Chase Loki  →', true, () => { input.confirm = true; });
  }
}
function drawGameOver(g) {
  g.fillStyle = 'rgba(8,6,6,.55)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(560, VW - 40), h = 230, x = (VW - w) / 2, y = 140;
  panel(g, x, y, w, h);
  txt(g, 'You have fallen', VW / 2, y + 58, 40, '#f3e7c9', 'center', DISPLAY, 400, '#2a1206', 6);
  txt(g, 'The Valkyries carry you back to try again.', VW / 2, y + 108, 19, '#e9dcc0', 'center', BODY, 500, null);
  if (G.st > .8) button(g, VW / 2 - 130, y + h - 72, 260, 46, 'Rise again', true, () => { input.confirm = true; });
}
function drawVictory(g) {
  g.fillStyle = 'rgba(8,10,16,.5)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(640, VW - 40), h = 300, x = (VW - w) / 2, y = 90;
  panel(g, x, y, w, h);
  drawMjolnir(g, VW / 2, y + 74, 1.3, Math.sin(G.t * 2) * .1, 1);
  txt(g, 'Mjölnir is yours again!', VW / 2, y + 138, 38, '#f3e7c9', 'center', DISPLAY, 400, '#2a1206', 6);
  g.font = `500 18px ${BODY}`;
  wrapText(g, 'Loki runs off to sulk. Asgard is safe, and the thunder answers to Thor once more.', w - 80).forEach((l, i) => txt(g, l, VW / 2, y + 176 + i * 22, 18, '#e9dcc0', 'center', BODY, 500, null));
  txt(g, `Final score ${G.score}   ·   Coins ${G.coins}`, VW / 2, y + 226, 21, '#ffe28a', 'center', BODY, 800, null);
  if (G.st > 1.5) button(g, VW / 2 - 110, y + h - 62, 220, 46, 'Skál!', true, () => { input.confirm = true; });
}

function render() {
  uiButtons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d1016'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawWorld(ctx);
  if (G.state === 'title') drawTitle(ctx);
  else {
    drawHUD(ctx);
    if (G.state === 'intro') drawIntro(ctx);
    else if (G.state === 'complete') drawComplete(ctx);
    else if (G.state === 'gameover') drawGameOver(ctx);
    else if (G.state === 'victory') drawVictory(ctx);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(8,10,16,.6)'; ctx.fillRect(0, 0, VW, VH);
    txt(ctx, 'Paused', VW / 2, VH / 2 - 20, 48, '#f3e7c9', 'center', DISPLAY, 400);
    txt(ctx, 'Press P or tap to continue', VW / 2, VH / 2 + 30, 19, '#e9dcc0');
  }
  if (window.innerHeight > window.innerWidth * 1.1) {
    ctx.fillStyle = 'rgba(180,40,31,.92)'; rr(ctx, VW / 2 - 200, VH - 120, 400, 40, 10); ctx.fill();
    txt(ctx, 'Turn your phone sideways for a bigger view', VW / 2, VH - 100, 17, '#fff', 'center', BODY, 800, null);
  }
  ctx.restore();
}

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now(), acc = 0;
const DT = 1 / 120;
function frame(now) {
  let el = (now - last) / 1000; last = now;
  if (el > .1) el = .1;
  handleMenus();
  acc += el;
  while (acc >= DT) { step(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
loadLevel(0, false);
G.state = 'title';
requestAnimationFrame(frame);

// small hook for automated checks
window.__mjolnir = { G, input, get L() { return L; }, get P() { return P; }, beginLevel, startGame, LEVELS };
})();
</script>
