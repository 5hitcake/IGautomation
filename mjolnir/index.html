<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mjölnir Lost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@500;800&display=swap">
<style>
  /* Single-look game: iron night, gold trim, blood-red accents. */
  :root{--bg:#0d1016;--fg:#f3e7c9;--gold:#e0a93b;--iron:#141a24;color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block;outline:none}
  .pad{position:fixed;z-index:5;display:none;gap:14px;bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  body.touch .pad{display:flex}
  #padL{left:calc(14px + env(safe-area-inset-left, 0px))}
  #padR{right:calc(14px + env(safe-area-inset-right, 0px));align-items:flex-end}
  .tb{width:70px;height:70px;border-radius:50%;border:2px solid rgba(224,169,59,.75);background:rgba(20,26,36,.5);
      color:var(--fg);font:800 15px "Alegreya Sans","Trebuchet MS",sans-serif;letter-spacing:.06em;
      display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
  .tb.on{background:rgba(224,169,59,.45)}
  .tb svg{width:30px;height:30px;fill:var(--fg)}
  #bJump{width:90px;height:90px;font-size:17px}
  #bRun{width:62px;height:62px;font-size:13px}
  #top{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top, 0px));right:calc(10px + env(safe-area-inset-right, 0px));display:flex;gap:8px}
  .ib{width:42px;height:42px;border-radius:10px;border:2px solid rgba(224,169,59,.65);background:rgba(20,26,36,.6);
      color:var(--fg);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .ib svg{width:20px;height:20px;fill:var(--fg)}
  .ib:focus-visible,.tb:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Mjölnir Lost, a Viking platformer"></canvas>
<div id="top">
  <button class="ib" id="bSound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path id="sndPath" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#f3e7c9" stroke-width="2" fill="#f3e7c9"/></svg></button>
  <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
</div>
<div class="pad" id="padL">
  <button class="tb" id="bLeft" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
  <button class="tb" id="bRight" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
</div>
<div class="pad" id="padR">
  <button class="tb" id="bRun" aria-label="Sprint">RUN</button>
  <button class="tb" id="bJump" aria-label="Jump">JUMP</button>
</div>

function drawSprite(g, name, fi, x, y, hGame, flip, sq = 0) {
  const m = SPRITE_META[name], f = m.frames[fi], s = hGame / m.h;

function drawBackdrop(g, img, cx, f) {

  const w = img.naturalWidth * (VH / img.naturalHeight), off = cx * f, k0 = Math.floor(off / w);
  for (let k = k0; k * w - off < VW; k++) {

function lgrad(g, x0, y0, x1, y1, stops) {

function rgrad(g, x, y, r0, r1, stops) {

function periodicNoise(seed, period) {

function buildLevel(idx) {
  const def = LEVELS[idx];
  const w = def.w;
  const L = { idx, def, w, grid: new Uint8Array(w * ROWS), bump: new Float32Array(w * ROWS), ents: [], storms: [], checks: [], signs: [], decor: [], start: null, goal: null, theme: THEMES[def.theme] };
  const set = (x, y, t) => { if (x < 0 || x >= w || y < 1 || y > ROWS) return; L.grid[(ROWS - y) * w + x] = t; };
  const standY = y => (ROWS - y + 1) * TS;
  const hunter = idx >= 2;
  const b = {
    floor(x0, x1) { this.hill(x0, x1, 2); },
    hill(x0, x1, h) { for (let x = x0; x <= x1; x++) for (let y = 1; y <= h; y++) set(x, y, T.GROUND); },
    brick(x, y, n = 1) { for (let i = 0; i < n; i++) set(x + i, y, T.BRICK); },
    q(x, y, kind) { set(x, y, kind === 'mead' ? T.QMEAD : T.QCOIN); },
    plank(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y, T.PLANK); },
    spikes(x0, x1, y = 3) { for (let x = x0; x <= x1; x++) set(x, y, T.SPIKE); },
    stairs(x, n, dir = 1) {
      for (let i = 0; i < n; i++) { const hgt = dir > 0 ? i + 1 : n - i; for (let j = 0; j < hgt; j++) set(x + i, 3 + j, T.BRICK); }
    },
    coins(x, y, n = 1) { for (let i = 0; i < n; i++) L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - y) * TS + 12, w: 24, h: 24, ph: (x + i) * .7 }); },
    arc(x, y, n) {
      for (let i = 0; i < n; i++) {
        const k = n > 1 ? i / (n - 1) : .5, hy = y + Math.sin(k * Math.PI) * 1.5;
        L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - hy) * TS + 12, w: 24, h: 24, ph: i * .7 });
      }
    },
    wolf(x, leaper) {
      L.ents.push({ type: 'wolf', x: x * TS, y: standY(3) - 32, w: 46, h: 32, vx: 0, vy: 0, dir: -1, speed: 70 + idx * 12, ph: x, dark: idx >= 2, leaper: !!leaper && hunter, cd: 1 + (x % 3) * .5 });
    },
    draugr(x) {
      L.ents.push({ type: 'draugr', x: x * TS + 6, y: standY(3) - 46, w: 32, h: 46, vx: 0, vy: 0, dir: -1, speed: 42 + idx * 6, ph: x, hp: 2, stun: 0 });
    },
    raven(x, y) {
      const cy = (ROWS - y) * TS + 10;
      L.ents.push({ type: 'raven', x: x * TS, y: cy, x0: x * TS, y0: cy, w: 34, h: 22, t: x, ph: x, face: -1, mode: 'patrol', mt: 0, cd: 1.5 });
    },
    sheep(x, range = 2) {
      L.ents.push({ type: 'sheep', x: x * TS + 6, y: standY(3) - 32, w: 36, h: 32, vx: 0, vy: 0, dir: 1, minX: (x - range) * TS, maxX: (x + range + 1) * TS, ph: 0, graze: 0, squish: 0, burnt: 0, moving: true });
    },
    sign(x, text) { L.signs.push({ x: x * TS + TS / 2, y: standY(3), text, rune: RUNE_KEYS[x % RUNE_KEYS.length] }); },
    check(x) { L.checks.push({ x: x * TS + TS / 2, y: standY(3), on: false, wave: 0 }); },
    start(x) { L.start = { x: x * TS + 10, y: standY(3) - 46 }; },
    goal(x) { L.goal = { x: x * TS + TS / 2, y: standY(3) }; },
    storm(x0, n, pattern, o) {
      L.storms.push({ x0: x0 * TS, n, slotW: TS * 2, pattern, interval: o.interval, pause: o.pause || 0, warn: o.warn || 1, t: .8, step: 0, strikes: [], mixI: 0, mixPat: 'sweepR', glow: 0, blobs: null, active: false });
    },
  };
  def.build(b);
  // stone pedestal for the hammer
  if (L.goal) { const gx = Math.floor(L.goal.x / TS); if (!def.final) set(gx, 3, T.USED); L.goal.y -= TS; }
  // cloud blobs over each storm
  L.storms.forEach((s, i) => {
    const R = rng(idx * 100 + i + 7); s.blobs = [];
    for (let x = s.x0 - 90; x < s.x0 + s.n * s.slotW + 90; x += 22) s.blobs.push({ x, y: 22 + R() * 36, r: 40 + R() * 34 });
    s.cloud = makeStormCloud(s, R);
    s.drops = []; for (let k = 0; k < s.n * 8; k++) s.drops.push({ x: R(), o: R() });
  });
  // procedural props on the ground
  const R = rng(idx * 31 + 5), props = L.theme.props;
  for (let x = 2; x < w - 2; x++) {
    for (let ty = 1; ty < ROWS; ty++) {
      if (L.grid[ty * w + x] === T.GROUND && L.grid[(ty - 1) * w + x] === T.EMPTY) {
        if (R() < .22) L.decor.push({ x: x * TS + 8 + R() * 32, y: ty * TS, type: props[Math.floor(R() * props.length)], s: .8 + R() * .4, r: R() });
        break;
      }
    }
  }
  return L;
}

/* ============================================================
   Main step
   ============================================================ */
function step(dt) {

  if (G.paused) return;
  G.flash = Math.max(0, G.flash - dt * 2.5); G.shake = Math.max(0, G.shake - dt * 30);
  if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'dying') updateDying(dt);
  else if (G.state === 'cutscene') updateCutscene(dt);
  else if (G.state === 'title') { cam.x = (Math.sin(G.t * .12) + 1) / 2 * Math.max(0, 36 * TS - VW); updateEnts(dt); }
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1.1);
  if (L) for (let i = 0; i < L.bump.length; i++) if (L.bump[i] > 0) L.bump[i] = Math.max(0, L.bump[i] - dt);
  L.checks.forEach(c => c.wave += dt);
  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < 3);
  updateWeather(dt);
  input.jumpPressed = false;
}

function handleMenus() {
  if (G.state === 'title') {
    const n = G.unlocked > 0 ? 2 : 1;
    if (input.up) G.sel = (G.sel + n - 1) % n;
    if (input.down) G.sel = (G.sel + 1) % n;
    if (input.confirm) { if (G.sel === 1 && G.unlocked > 0) startGame(G.unlocked); else startGame(0); }
  } else if (G.state === 'intro') {
    if ((input.confirm && G.st > .4) || G.st > 4.5) { G.state = 'play'; }
  } else if (G.state === 'complete') {
    if (input.confirm && G.st > .8) { beginLevel(G.level + 1); }
  } else if (G.state === 'gameover') {
    if (input.confirm && G.st > .8) { G.score = G.lvlScore; G.coins = G.lvlCoins; G.lives = 3; beginLevel(G.level); }
  } else if (G.state === 'victory') {
    if (input.confirm && G.st > 1.5) { G.state = 'title'; G.sel = 0; loadLevel(0, false); }
  }
  input.confirm = false; input.up = false; input.down = false;
}

function button(g, x, y, w, h, label, sel, fn) {
  if (sel) glow(g, x + w / 2, y + h / 2, w * .6, '255,170,90', .18);
  g.fillStyle = sel ? lgrad(g, 0, y, 0, y + h, ['#a8283a', '#6a1424']) : 'rgba(36,30,54,.92)'; rr(g, x, y, w, h, 12); g.fill();
  g.strokeStyle = sel ? '#ffd88a' : 'rgba(201,160,69,.6)'; g.lineWidth = 2; rr(g, x, y, w, h, 12); g.stroke();
  txt(g, label, x + w / 2, y + h / 2 + 1, 21, '#f6ecd4', 'center', BODY, 800, null);
  uiButtons.push({ x, y, w, h, fn });
}
function drawTitle(g) {
  g.fillStyle = lgrad(g, 0, 0, 0, VH, ['rgba(6,4,16,.55)', 'rgba(6,4,16,.15)', 'rgba(6,4,16,.6)']); g.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  glow(g, cx, 150, 260, '120,160,255', .12);
  drawRuneText(g, 'mjolnir', cx, 40, 30, 'rgba(224,180,90,.95)', 3);
  const pulse = 1 + Math.sin(G.t * 2) * .012;
  g.save(); g.translate(cx, 150); g.scale(pulse, pulse);
  g.shadowColor = 'rgba(140,190,255,.7)'; g.shadowBlur = 24;
  txt(g, 'MJÖLNIR', 0, 0, Math.min(96, VW / 8.5), '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 10);
  g.restore();
  txt(g, 'The Lost Hammer of Thor', cx, 214, 26, '#ffd88a', 'center', DISPLAY, 400, '#140a1e', 6);
  drawMjolnir(g, cx - Math.min(300, VW * .33), 160, 1.5, -.35, 1);
  drawValknut(g, cx + Math.min(300, VW * .33), 150, 70, 'rgba(224,180,90,.9)', 4);
  txt(g, 'Loki has stolen Mjölnir. Chase the trickster through five realms and take it back!', cx, 258, 19, '#efe3c8');
  const bw = 290, bh = 50;
  button(g, cx - bw / 2, 292, bw, bh, 'Begin the Quest', G.sel === 0, () => startGame(0));
  if (G.unlocked > 0) button(g, cx - bw / 2, 352, bw, bh, 'Continue: ' + LEVELS[G.unlocked].name, G.sel === 1, () => startGame(G.unlocked));
  const touchUI = document.body.classList.contains('touch');
  txt(g, touchUI ? 'Use the buttons at the bottom: ◀ ▶ to run, JUMP to leap, RUN to sprint.' : '← → / A D run  ·  SPACE / W jump  ·  SHIFT sprint  ·  P pause  ·  M sound', cx, VH - 70, 17, 'rgba(243,231,201,.9)');
  txt(g, 'Stomp wolves, ravens and draugar · bounce on sheep · read the runes before the lightning strikes', cx, VH - 44, 16, 'rgba(255,216,138,.85)');
}
function drawIntro(g) {
  const d = LEVELS[G.level], a = clamp(G.st * 3, 0, 1);
  g.save(); g.globalAlpha = a;
  const w = Math.min(660, VW - 40), h = 260, x = (VW - w) / 2, y = 115;
  panel(g, x, y, w, h);
  txt(g, `Realm ${['I', 'II', 'III', 'IV', 'V'][G.level]} of V`, VW / 2, y + 50, 18, '#c9a045', 'center', BODY, 800, null);
  txt(g, d.name, VW / 2, y + 94, 48, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  drawRuneText(g, d.name, VW / 2, y + 126, 16, 'rgba(224,180,90,.9)', 2);
  txt(g, d.sub, VW / 2, y + 162, 20, '#ffd88a', 'center', BODY, 800, null);
  g.font = `500 18px ${BODY}`;
  wrapText(g, d.intro, w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 196 + i * 22, 18, '#e3d6bc', 'center', BODY, 500, null));
  g.restore();
  if (G.st > .6) txt(g, 'Press JUMP to begin', VW / 2, y + h + 34, 18, `rgba(243,231,201,${.6 + Math.sin(G.t * 4) * .4})`);
}
function drawComplete(g) {
  const d = LEVELS[G.level], w = Math.min(620, VW - 40), h = 280, x = (VW - w) / 2, y = 105;
  panel(g, x, y, w, h);
  txt(g, 'Mjölnir slipped away!', VW / 2, y + 60, 36, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  g.font = `500 19px ${BODY}`;
  wrapText(g, d.next, w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 104 + i * 24, 19, '#e3d6bc', 'center', BODY, 500, null));
  txt(g, `${d.name} cleared`, VW / 2, y + 164, 20, '#c9a045', 'center', BODY, 800, null);
  txt(g, `Coins ${G.coins}   ·   Score ${G.score}`, VW / 2, y + 194, 20, '#ffd88a', 'center', BODY, 800, null);
  if (G.st > .8) button(g, VW / 2 - 130, y + h - 64, 260, 44, 'Chase Loki  →', true, () => { input.confirm = true; });
}
function drawGameOver(g) {
  g.fillStyle = 'rgba(6,4,12,.55)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(580, VW - 40), h = 240, x = (VW - w) / 2, y = 135;
  panel(g, x, y, w, h);
  txt(g, 'You have fallen', VW / 2, y + 62, 40, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  txt(g, 'The Valkyries carry you back to try again.', VW / 2, y + 112, 19, '#e3d6bc', 'center', BODY, 500, null);
  if (G.st > .8) button(g, VW / 2 - 130, y + h - 76, 260, 46, 'Rise again', true, () => { input.confirm = true; });
}
function drawVictory(g) {
  g.fillStyle = 'rgba(6,4,12,.45)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(660, VW - 40), h = 310, x = (VW - w) / 2, y = 85;
  panel(g, x, y, w, h);
  drawMjolnir(g, VW / 2, y + 80, 1.3, Math.sin(G.t * 2) * .1, 1);
  txt(g, 'Mjölnir is yours again!', VW / 2, y + 142, 38, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  g.font = `500 18px ${BODY}`;
  wrapText(g, 'Loki slinks off to plot his next trick. Asgard is safe, and the thunder answers to Thor once more.', w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 180 + i * 22, 18, '#e3d6bc', 'center', BODY, 500, null));
  txt(g, `Final score ${G.score}   ·   Coins ${G.coins}`, VW / 2, y + 232, 21, '#ffd88a', 'center', BODY, 800, null);
  if (G.st > 1.5) button(g, VW / 2 - 110, y + h - 62, 220, 46, 'Skál!', true, () => { input.confirm = true; });
}

function render() {
  uiButtons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07050d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawWorld(ctx);
  if (G.state === 'title') {
    ctx.save(); ctx.translate(VW * .16, VH - TS * 2 + 1); ctx.scale(1.6, 1.6); drawHero(ctx, 0, 0, { face: 1, t: G.t, run: 0, phase: 0, air: false }); ctx.restore();
    drawTitle(ctx);
  } else {
    drawHUD(ctx);
    if (G.state === 'intro') drawIntro(ctx);
    else if (G.state === 'complete') drawComplete(ctx);
    else if (G.state === 'gameover') drawGameOver(ctx);
    else if (G.state === 'victory') drawVictory(ctx);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(6,4,12,.6)'; ctx.fillRect(0, 0, VW, VH);
    txt(ctx, 'Paused', VW / 2, VH / 2 - 20, 48, '#f6ecd4', 'center', DISPLAY, 400);
    txt(ctx, 'Press P or tap to continue', VW / 2, VH / 2 + 30, 19, '#e3d6bc');
  }
  if (window.innerHeight > window.innerWidth * 1.1) {
    ctx.fillStyle = 'rgba(140,30,44,.92)'; rr(ctx, VW / 2 - 200, VH - 120, 400, 40, 10); ctx.fill();
    txt(ctx, 'Turn your phone sideways for a bigger view', VW / 2, VH - 100, 17, '#fff', 'center', BODY, 800, null);
  }
  ctx.restore();
}

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now(), acc = 0;
const DT = 1 / 120;
function frame(now) {
  let el = (now - last) / 1000; last = now;
  if (el > .1) el = .1;
  handleMenus();
  acc += el;
  while (acc >= DT) { step(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
loadLevel(0, false);
G.state = 'title';
requestAnimationFrame(frame);

// small hook for automated checks
window.__mjolnir = { G, input, get L() { return L; }, get P() { return P; }, beginLevel, startGame, LEVELS };
})();
</script>
