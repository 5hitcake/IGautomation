<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mjölnir Lost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@500;800&display=swap">
<style>
  /* Single-look game: iron night, gold trim, blood-red accents. */
  :root{--bg:#0d1016;--fg:#f3e7c9;--gold:#e0a93b;--iron:#141a24;color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block;outline:none}
  .pad{position:fixed;z-index:5;display:none;gap:14px;bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  body.touch .pad{display:flex}
  #padL{left:calc(14px + env(safe-area-inset-left, 0px))}
  #padR{right:calc(14px + env(safe-area-inset-right, 0px));align-items:flex-end}
  .tb{width:70px;height:70px;border-radius:50%;border:2px solid rgba(224,169,59,.75);background:rgba(20,26,36,.5);
      color:var(--fg);font:800 15px "Alegreya Sans","Trebuchet MS",sans-serif;letter-spacing:.06em;
      display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
  .tb.on{background:rgba(224,169,59,.45)}
  .tb svg{width:30px;height:30px;fill:var(--fg)}
  #bJump{width:90px;height:90px;font-size:17px}
  #bRun{width:62px;height:62px;font-size:13px}
  #top{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top, 0px));right:calc(10px + env(safe-area-inset-right, 0px));display:flex;gap:8px}
  .ib{width:42px;height:42px;border-radius:10px;border:2px solid rgba(224,169,59,.65);background:rgba(20,26,36,.6);
      color:var(--fg);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .ib svg{width:20px;height:20px;fill:var(--fg)}
  .ib:focus-visible,.tb:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Mjölnir Lost, a Viking platformer"></canvas>
<div id="top">
  <button class="ib" id="bSound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path id="sndPath" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#f3e7c9" stroke-width="2" fill="#f3e7c9"/></svg></button>
  <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
</div>
<div class="pad" id="padL">
  <button class="tb" id="bLeft" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
  <button class="tb" id="bRight" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
</div>
<div class="pad" id="padR">
  <button class="tb" id="bRun" aria-label="Sprint">RUN</button>
  <button class="tb" id="bJump" aria-label="Jump">JUMP</button>
</div>
<script>
(() => {
'use strict';

/* ============================================================
   Core constants
   ============================================================ */
const TS = 48, ROWS = 12, VH = ROWS * TS;
const T = { EMPTY:0, GROUND:1, BRICK:2, QCOIN:3, QMEAD:4, USED:5, PLANK:6, SPIKE:7 };
const SOLID = [false, true, true, true, true, true, false, false];
const DISPLAY = '"Uncial Antiqua", "Palatino Linotype", Georgia, serif';
const BODY = '"Alegreya Sans", "Trebuchet MS", system-ui, sans-serif';
const GRAV = 2300;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ============================================================
   Canvas & scaling
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let VW = 1024, scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  scale = Math.min(H / VH, W / 640);
  VW = Math.min(W / scale, 1400);
  offX = (W - VW * scale) / 2; offY = (H - VH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

/* ============================================================
   Runes (Elder Futhark, drawn as carved strokes)
   ============================================================ */
const RUNES = {
  f:[[0,0,0,1],[0,.3,.55,0],[0,.55,.55,.25]],
  u:[[0,0,0,1],[0,0,.55,.3],[.55,.3,.55,1]],
  th:[[0,0,0,1],[0,.25,.5,.5],[.5,.5,0,.75]],
  a:[[0,0,0,1],[0,0,.55,.3],[0,.3,.55,.6]],
  r:[[0,0,0,1],[0,0,.5,.22],[.5,.22,0,.46],[0,.46,.55,1]],
  k:[[.55,0,0,.3],[0,.3,.55,.6]],
  g:[[0,0,.6,1],[.6,0,0,1]],
  w:[[0,0,0,1],[0,0,.5,.22],[.5,.22,0,.46]],
  h:[[0,0,0,1],[.6,0,.6,1],[0,.3,.6,.55]],
  n:[[.3,0,.3,1],[.05,.3,.55,.55]],
  i:[[.3,0,.3,1]],
  j:[[.3,.05,.05,.3],[.05,.3,.3,.55],[.3,.45,.55,.7],[.55,.7,.3,.95]],
  p:[[0,0,0,1],[0,0,.5,.25],[0,1,.5,.75]],
  z:[[.3,0,.3,1],[.3,.4,0,0],[.3,.4,.6,0]],
  s:[[.55,0,.1,.35],[.1,.35,.5,.65],[.5,.65,.05,1]],
  t:[[.3,0,.3,1],[.3,0,0,.3],[.3,0,.6,.3]],
  b:[[0,0,0,1],[0,0,.5,.25],[.5,.25,0,.5],[0,.5,.5,.75],[.5,.75,0,1]],
  e:[[0,0,0,1],[.6,0,.6,1],[0,0,.3,.3],[.3,.3,.6,0]],
  m:[[0,0,0,1],[.6,0,.6,1],[0,0,.6,.45],[.6,0,0,.45]],
  l:[[0,0,0,1],[0,0,.5,.3]],
  o:[[.3,0,0,.35],[.3,0,.6,.35],[0,.35,.6,1],[.6,.35,0,1]],
  d:[[0,0,0,1],[.6,0,.6,1],[0,0,.6,1],[0,1,.6,0]],
};
const RUNE_KEYS = Object.keys(RUNES);
const LAT = {a:'a',á:'a',b:'b',c:'k',d:'d',ð:'th',e:'e',é:'e',f:'f',g:'g',h:'h',i:'i',í:'i',j:'j',k:'k',l:'l',m:'m',n:'n',o:'o',ö:'o',ó:'o',p:'p',q:'k',r:'r',s:'s',t:'t',u:'u',ú:'u',v:'w',w:'w',x:'k',y:'j',z:'z',þ:'th',ä:'a',ø:'o'};
function runeWord(str) {
  const s = str.toLowerCase(), out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === 't' && s[i + 1] === 'h') { out.push('th'); i++; continue; }
    if (s[i] === ' ') { out.push(null); continue; }
    if (LAT[s[i]]) out.push(LAT[s[i]]);
  }
  return out;
}
function drawRune(g, key, x, y, h, color, lw) {
  const R = RUNES[key]; if (!R) return;
  g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (const s of R) { g.moveTo(x + s[0] * h, y + s[1] * h); g.lineTo(x + s[2] * h, y + s[3] * h); }
  g.stroke();
}
function drawRuneText(g, str, cx, y, h, color, lw) {
  const w = runeWord(str), step = h * .72;
  let x = cx - (w.length * step - h * .12) / 2;
  for (const k of w) { if (k) drawRune(g, k, x, y, h, color, lw); x += step; }
}

/* ============================================================
   Drawing helpers (ink outlines + cel shading)
   ============================================================ */
const OL = '#150f1c';
function ink(g, fill, lw = 1.8) {
  g.fillStyle = fill; g.fill();
  if (lw) { g.lineWidth = lw; g.strokeStyle = OL; g.lineJoin = 'round'; g.stroke(); }
}
function lgrad(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function rgrad(g, x, y, r0, r1, stops) {
  const gr = g.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function glow(g, x, y, r, rgb, a) {
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = rgrad(g, x, y, 0, r, [`rgba(${rgb},${a})`, `rgba(${rgb},${a * .35})`, `rgba(${rgb},0)`]);
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function periodicNoise(seed, period) {
  const R = rng(seed), v = new Float32Array(period);
  for (let i = 0; i < period; i++) v[i] = R();
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return v[((i % period) + period) % period] * (1 - u) + v[(((i + 1) % period) + period) % period] * u;
  };
}
function makeFbm(seed, base, oct) {
  const ns = []; for (let o = 0; o < oct; o++) ns.push(periodicNoise(seed + o * 101, base << o));
  return (t, ridged) => {
    let s = 0, a = .5, norm = 0;
    for (let o = 0; o < oct; o++) { let n = ns[o](t * (base << o)); if (ridged) n = 1 - Math.abs(n * 2 - 1); s += n * a; norm += a; a *= .5; }
    return s / norm;
  };
}

/* ============================================================
   Nordic symbols
   ============================================================ */
function drawValknut(g, x, y, s, color, lw) {
  g.save(); g.translate(x, y); g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = 'round';
  for (let k = 0; k < 3; k++) {
    const a = -Math.PI / 2 + k * Math.PI * 2 / 3, ox = Math.cos(a) * s * .28, oy = Math.sin(a) * s * .28;
    g.beginPath();
    for (let j = 0; j < 3; j++) {
      const b = Math.PI / 2 + j * Math.PI * 2 / 3;
      const px = ox + Math.cos(b) * s * .5, py = oy - Math.sin(b) * s * .5;
      j ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
  }
  g.restore();
}
function drawKnotBand(g, x, y, w, color, amp) {
  g.save(); g.strokeStyle = color; g.lineWidth = 2;
  for (let p = 0; p < 2; p++) {
    g.beginPath();
    for (let i = 0; i <= w; i += 3) { const yy = y + Math.sin(i / 9 + p * Math.PI) * amp; i ? g.lineTo(x + i, yy) : g.moveTo(x + i, yy); }
    g.stroke();
  }
  g.restore();
}
function drawShield(g, x, y, r, full) {
  g.save(); g.translate(x, y);
  if (full) {
    g.beginPath(); g.arc(0, 0, r, 0, 7);
    g.fillStyle = rgrad(g, -r * .3, -r * .3, 0, r * 1.2, ['#d8483c', '#8e1f2c', '#4a0d18']); g.fill();
    g.save(); g.clip();
    g.fillStyle = 'rgba(240,226,196,.9)';
    for (let q = 0; q < 4; q += 2) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, q * Math.PI / 2 + .3, (q + 1) * Math.PI / 2 + .3); g.closePath(); g.fill(); }
    g.restore();
    g.lineWidth = 2.4; g.strokeStyle = '#2a1c14'; g.beginPath(); g.arc(0, 0, r - 1, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,220,160,.5)'; g.lineWidth = 1; g.beginPath(); g.arc(0, 0, r - 3, Math.PI * 1.1, Math.PI * 1.6); g.stroke();
    g.beginPath(); g.arc(0, 0, r * .32, 0, 7); g.fillStyle = rgrad(g, -1, -1, 0, r * .32, ['#f3f6fa', '#8e98a8']); g.fill(); g.strokeStyle = OL; g.lineWidth = 1.2; g.stroke();
  } else {
    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = 'rgba(30,26,40,.7)'; g.fill();
    g.strokeStyle = 'rgba(160,150,180,.45)'; g.lineWidth = 1.5; g.setLineDash([3, 3]); g.stroke(); g.setLineDash([]);
  }
  g.restore();
}

/* ============================================================
   Mjölnir
   ============================================================ */
function drawMjolnir(g, x, y, s, ang, gl) {
  g.save(); g.translate(x, y); g.rotate(ang || 0); g.scale(s, s);
  if (gl) {
    glow(g, 0, -10, 52, '130,190,255', .45 * gl);
    g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(190,225,255,${.7 * gl})`; g.lineWidth = 1.2;
    for (let k = 0; k < 2; k++) {
      const a0 = Math.random() * 7; g.beginPath(); let px = Math.cos(a0) * 16, py = -10 + Math.sin(a0) * 10; g.moveTo(px, py);
      for (let i = 0; i < 4; i++) { px += (Math.random() - .5) * 14 + Math.cos(a0) * 6; py += (Math.random() - .5) * 12 + Math.sin(a0) * 4; g.lineTo(px, py); }
      g.stroke();
    }
    g.restore();
  }
  // handle
  g.beginPath(); rr(g, -3.2, -3, 6.4, 26, 2.5); ink(g, lgrad(g, -3, 0, 3, 0, ['#7a4d2a', '#4a2c16']), 1.5);
  g.strokeStyle = '#2c180b'; g.lineWidth = 1.4;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(-3.2, 1 + i * 3.4); g.lineTo(3.2, 3 + i * 3.4); g.stroke(); }
  g.beginPath(); rr(g, -4.2, 21, 8.4, 4, 1.5); ink(g, '#c9a045', 1.3);
  g.beginPath(); g.ellipse(0, 29.5, 3, 4.5, 0, 0, 7); g.strokeStyle = OL; g.lineWidth = 2.6; g.stroke(); g.strokeStyle = '#6a4424'; g.lineWidth = 1.4; g.stroke();
  // head
  g.beginPath(); g.moveTo(-21, -21); g.lineTo(21, -21); g.lineTo(24, -17); g.lineTo(24, -5); g.lineTo(21, -1); g.lineTo(-21, -1); g.lineTo(-24, -5); g.lineTo(-24, -17); g.closePath();
  ink(g, lgrad(g, 0, -21, 0, -1, ['#e4ebf2', '#a7b2c0', '#6b7585']), 2);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(-20, -19.5, 40, 2.5);
  g.fillStyle = 'rgba(20,24,40,.25)'; g.fillRect(-21, -6, 42, 4);
  g.strokeStyle = '#4b5463'; g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(-14, -18); g.lineTo(-14, -4); g.moveTo(14, -18); g.lineTo(14, -4); g.stroke();
  // knot and glowing runes
  g.strokeStyle = '#3a4252'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-7, -16); g.quadraticCurveTo(0, -4, 7, -16); g.moveTo(-7, -6); g.quadraticCurveTo(0, -18, 7, -6); g.stroke();
  drawRune(g, 'th', -20.5, -16, 9, gl ? '#9fdcff' : '#5a6475', 1.3);
  drawRune(g, 'th', 17, -16, 9, gl ? '#9fdcff' : '#5a6475', 1.3);
  g.restore();
}

/* ============================================================
   Characters: chibi anime, ink-outlined
   ============================================================ */
function animeEye(g, ex, ey, w, h, iris, blink, look) {
  if (blink) { g.strokeStyle = OL; g.lineWidth = 1.8; g.beginPath(); g.moveTo(ex - w, ey + 1); g.quadraticCurveTo(ex, ey + 2.5, ex + w, ey + 1); g.stroke(); return; }
  g.beginPath(); g.ellipse(ex, ey, w, h, 0, 0, 7); g.fillStyle = '#fbf7ee'; g.fill();
  g.beginPath(); g.ellipse(ex + (look || 0), ey + h * .12, w * .82, h * .85, 0, 0, 7);
  g.fillStyle = rgrad(g, ex, ey + h * .5, 0, h * 1.1, [iris[0], iris[1], iris[2]]); g.fill();
  g.beginPath(); g.ellipse(ex + (look || 0) + .3, ey + h * .1, w * .38, h * .45, 0, 0, 7); g.fillStyle = '#0b0d1a'; g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(ex - w * .3, ey - h * .38, w * .32, h * .22, -.4, 0, 7); g.fill();
  g.beginPath(); g.arc(ex + w * .35, ey + h * .42, Math.max(.6, w * .14), 0, 7); g.fill();
  g.strokeStyle = OL; g.lineWidth = 2.2; g.lineCap = 'round';
  g.beginPath(); g.ellipse(ex, ey, w + .5, h + .3, 0, Math.PI * 1.08, Math.PI * 1.94); g.stroke();
}

function drawThor(g, x, y, o) {
  g.save(); g.translate(x, y); g.scale(1.22, 1.22);
  const sq = o.squash || 0;
  g.scale((o.face < 0 ? -1 : 1) * (1 + sq * .14), 1 - sq * .14);
  const t = o.t, run = o.run || 0, ph = o.phase || 0, air = o.air;
  const bob = air ? 0 : -Math.abs(Math.sin(ph)) * 2.6 * run + Math.sin(t * 2.3) * .8 * (1 - run);
  const legA = air ? .7 : Math.sin(ph) * .95 * run;
  let armF = air ? -2.5 : -Math.sin(ph) * 1.05 * run + .2, armB = air ? -2.1 : Math.sin(ph) * 1.05 * run + .2;
  if (o.raise) { armF = -3.0; armB = -.3; }
  if (o.fist) armF = -2.6 + Math.sin(t * 22) * .25;
  if (o.carried) { armF = -2.9; armB = -2.8; }
  g.translate(0, bob);
  const trail = run + (air ? .7 : 0) + (o.carried ? 1 : 0), wave = Math.sin(t * 10) * (1.4 + run * 2.4);
  const HAIR = lgrad(g, 0, -60, 0, -20, ['#f08a44', '#cf4f22', '#8d2c14']);
  // cape
  g.beginPath(); g.moveTo(-5, -29);
  g.bezierCurveTo(-14 - trail * 8, -25, -19 - trail * 12, -13 + wave * .5, -22 - trail * 14, -1 + wave);
  g.lineTo(-18 - trail * 12, -4 + wave * .8); g.lineTo(-15 - trail * 10, 1 + wave * .6); g.lineTo(-11 - trail * 8, -3 + wave * .4); g.lineTo(-7 - trail * 5, 1 + wave * .3);
  g.quadraticCurveTo(-1, -14, 5, -29); g.closePath();
  ink(g, lgrad(g, 0, -30, 0, 2, ['#a3263a', '#6e1424', '#3e0a16']));
  // long back hair
  g.beginPath(); g.moveTo(-3, -57);
  g.bezierCurveTo(-19 - trail * 4, -56, -22 - trail * 7, -40, -20 - trail * 10, -24 + wave * .35);
  g.quadraticCurveTo(-17 - trail * 8, -28, -15 - trail * 8, -20 + wave * .3);
  g.quadraticCurveTo(-12 - trail * 4, -30, -8, -33); g.quadraticCurveTo(-6, -44, -3, -57); g.closePath(); ink(g, HAIR);
  g.strokeStyle = 'rgba(255,190,120,.45)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-9, -50); g.quadraticCurveTo(-16 - trail * 5, -42, -16 - trail * 8, -28); g.stroke();
  const leg = (hx, a, back) => {
    g.save(); g.translate(hx, -12); g.rotate(a);
    g.beginPath(); rr(g, -4.2, -1, 8.4, 9, 3); ink(g, back ? '#1a1524' : '#2b2438', 1.6);
    g.beginPath(); g.moveTo(-5, 6); g.lineTo(5, 6); g.quadraticCurveTo(11.5, 7.5, 10.5, 12.5); g.lineTo(-5, 12.5); g.closePath();
    ink(g, back ? '#342821' : '#5a4331', 1.6);
    g.beginPath(); g.ellipse(0, 6.5, 6.2, 2.9, 0, 0, 7); ink(g, back ? '#7d6e62' : '#cdb89c', 1.3);
    g.restore();
  };
  const arm = (sx, a, back, hammer) => {
    g.save(); g.translate(sx, -27); g.rotate(a);
    const sk = back ? '#cf936f' : '#f5c29d';
    g.beginPath(); g.ellipse(0, 4, 5.8, 6.6, 0, 0, 7); ink(g, sk, 1.6);
    g.beginPath(); rr(g, -4, 6, 8, 9, 3.6); ink(g, sk, 1.6);
    g.beginPath(); rr(g, -4.6, 8.5, 9.2, 5.5, 1.8); ink(g, back ? '#3a2616' : '#5e3b22', 1.4);
    g.fillStyle = '#d7dde6'; g.beginPath(); g.arc(0, 11.2, 1.1, 0, 7); g.fill();
    g.beginPath(); g.arc(0, 16.5, 4.4, 0, 7); ink(g, sk, 1.6);

const LAYER_W = 2048;
function drawPine(g, x, base, h, col, rim, snow, R) {
  const tiers = 6 + Math.floor(R() * 3), maxW = h * .3;
  g.fillStyle = col; g.fillRect(x - h * .022, base - h * .2, h * .044, h * .2);
  for (let i = 0; i < tiers; i++) {
    const k = i / tiers, ty = base - h * .12 - k * h * .78, w = maxW * (1 - k * .82), th = h * .78 / tiers * 1.9;
    const teeth = 4 + Math.floor(w / 5);
    g.beginPath(); g.moveTo(x - w, ty + 2 + R() * 2);

function buildLevel(idx) {
  const def = LEVELS[idx];
  const w = def.w;
  const L = { idx, def, w, grid: new Uint8Array(w * ROWS), bump: new Float32Array(w * ROWS), ents: [], storms: [], checks: [], signs: [], decor: [], start: null, goal: null, theme: THEMES[def.theme] };
  const set = (x, y, t) => { if (x < 0 || x >= w || y < 1 || y > ROWS) return; L.grid[(ROWS - y) * w + x] = t; };
  const standY = y => (ROWS - y + 1) * TS;
  const hunter = idx >= 2;
  const b = {
    floor(x0, x1) { this.hill(x0, x1, 2); },
    hill(x0, x1, h) { for (let x = x0; x <= x1; x++) for (let y = 1; y <= h; y++) set(x, y, T.GROUND); },
    brick(x, y, n = 1) { for (let i = 0; i < n; i++) set(x + i, y, T.BRICK); },
    q(x, y, kind) { set(x, y, kind === 'mead' ? T.QMEAD : T.QCOIN); },
    plank(x, y, n) { for (let i = 0; i < n; i++) set(x + i, y, T.PLANK); },
    spikes(x0, x1, y = 3) { for (let x = x0; x <= x1; x++) set(x, y, T.SPIKE); },
    stairs(x, n, dir = 1) {
      for (let i = 0; i < n; i++) { const hgt = dir > 0 ? i + 1 : n - i; for (let j = 0; j < hgt; j++) set(x + i, 3 + j, T.BRICK); }
    },
    coins(x, y, n = 1) { for (let i = 0; i < n; i++) L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - y) * TS + 12, w: 24, h: 24, ph: (x + i) * .7 }); },
    arc(x, y, n) {
      for (let i = 0; i < n; i++) {
        const k = n > 1 ? i / (n - 1) : .5, hy = y + Math.sin(k * Math.PI) * 1.5;
        L.ents.push({ type: 'coin', x: (x + i) * TS + 12, y: (ROWS - hy) * TS + 12, w: 24, h: 24, ph: i * .7 });
      }
    },
    wolf(x, leaper) {
      L.ents.push({ type: 'wolf', x: x * TS, y: standY(3) - 32, w: 46, h: 32, vx: 0, vy: 0, dir: -1, speed: 70 + idx * 12, ph: x, dark: idx >= 2, leaper: !!leaper && hunter, cd: 1 + (x % 3) * .5 });
    },
    draugr(x) {
      L.ents.push({ type: 'draugr', x: x * TS + 6, y: standY(3) - 46, w: 32, h: 46, vx: 0, vy: 0, dir: -1, speed: 42 + idx * 6, ph: x, hp: 2, stun: 0 });
    },
    raven(x, y) {
      const cy = (ROWS - y) * TS + 10;
      L.ents.push({ type: 'raven', x: x * TS, y: cy, x0: x * TS, y0: cy, w: 34, h: 22, t: x, ph: x, face: -1, mode: 'patrol', mt: 0, cd: 1.5 });
    },
    sheep(x, range = 2) {
      L.ents.push({ type: 'sheep', x: x * TS + 6, y: standY(3) - 32, w: 36, h: 32, vx: 0, vy: 0, dir: 1, minX: (x - range) * TS, maxX: (x + range + 1) * TS, ph: 0, graze: 0, squish: 0, burnt: 0, moving: true });
    },
    sign(x, text) { L.signs.push({ x: x * TS + TS / 2, y: standY(3), text, rune: RUNE_KEYS[x % RUNE_KEYS.length] }); },
    check(x) { L.checks.push({ x: x * TS + TS / 2, y: standY(3), on: false, wave: 0 }); },
    start(x) { L.start = { x: x * TS + 10, y: standY(3) - 46 }; },
    goal(x) { L.goal = { x: x * TS + TS / 2, y: standY(3) }; },
    storm(x0, n, pattern, o) {
      L.storms.push({ x0: x0 * TS, n, slotW: TS * 2, pattern, interval: o.interval, pause: o.pause || 0, warn: o.warn || 1, t: .8, step: 0, strikes: [], mixI: 0, mixPat: 'sweepR', glow: 0, blobs: null, active: false });
    },
  };
  def.build(b);
  // stone pedestal for the hammer
  if (L.goal) { const gx = Math.floor(L.goal.x / TS); set(gx, 3, T.USED); L.goal.y -= TS; }
  // cloud blobs over each storm
  L.storms.forEach((s, i) => {
    const R = rng(idx * 100 + i + 7); s.blobs = [];
    for (let x = s.x0 - 90; x < s.x0 + s.n * s.slotW + 90; x += 22) s.blobs.push({ x, y: 22 + R() * 36, r: 40 + R() * 34 });
    s.cloud = makeStormCloud(s, R);
    s.drops = []; for (let k = 0; k < s.n * 8; k++) s.drops.push({ x: R(), o: R() });
  });
  // procedural props on the ground
  const R = rng(idx * 31 + 5), props = L.theme.props;
  for (let x = 2; x < w - 2; x++) {
    for (let ty = 1; ty < ROWS; ty++) {
      if (L.grid[ty * w + x] === T.GROUND && L.grid[(ty - 1) * w + x] === T.EMPTY) {
        if (R() < .22) L.decor.push({ x: x * TS + 8 + R() * 32, y: ty * TS, type: props[Math.floor(R() * props.length)], s: .8 + R() * .4, r: R() });
        break;
      }
    }
  }
  return L;
}

/* ---------- Weather ---------- */

/* ============================================================
   Main step
   ============================================================ */

  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }

  if (L) for (let i = 0; i < L.bump.length; i++) if (L.bump[i] > 0) L.bump[i] = Math.max(0, L.bump[i] - dt);

}

    const n = G.unlocked > 0 ? 2 : 1;
    if (input.up) G.sel = (G.sel + n - 1) % n;
    if (input.down) G.sel = (G.sel + 1) % n;

  } else if (G.state === 'complete') {
    if (input.confirm && G.st > .8) { beginLevel(G.level + 1); }
  } else if (G.state === 'gameover') {
    if (input.confirm && G.st > .8) { G.score = G.lvlScore; G.coins = G.lvlCoins; G.lives = 3; beginLevel(G.level); }
  } else if (G.state === 'victory') {

  }
  else if (w === 'motes') { for (const f of weather) { const x = f.x % VW; glow(g, x, f.y, 6, '255,220,150', .3); } }
  if (G.flash > 0) { g.fillStyle = `rgba(220,235,255,${G.flash * .4})`; g.fillRect(0, 0, VW, VH); }
  const vg = g.createRadialGradient(VW / 2, VH * .55, VH * .35, VW / 2, VH * .55, VW * .72);
  vg.addColorStop(0, 'rgba(8,4,20,0)'); vg.addColorStop(1, 'rgba(8,4,20,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
}

/* ---------- HUD & screens ---------- */
function txt(g, s, x, y, size, color, align = 'center', font = BODY, weight = 800, stroke = 'rgba(10,6,16,.85)', sw = 5) {
  g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = sw; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function drawHUD(g) {
  g.fillStyle = 'rgba(16,12,28,.72)'; rr(g, 10, 10, 336, 48, 14); g.fill();
  g.strokeStyle = 'rgba(224,169,59,.55)'; g.lineWidth = 1.5; rr(g, 10, 10, 336, 48, 14); g.stroke();
  for (let i = 0; i < 3; i++) drawShield(g, 35 + i * 30, 34, 12, i < G.hearts);
  g.save(); g.translate(138, 35); g.scale(.62, .62);
  g.beginPath(); g.arc(0, 0, 13, 0, 7); ink(g, '#f5c29d', 1.6);
  g.beginPath(); g.moveTo(-9, 2); g.quadraticCurveTo(0, 22, 11, 3); g.quadraticCurveTo(4, 8, -9, 2); ink(g, '#d45a26', 1.4);
  g.beginPath(); g.arc(0, -2, 14, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); ink(g, '#c6cfdb', 1.4);
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(-16, -8, 9, 3, -.5, 0, 7); g.ellipse(16, -8, 9, 3, .5, 0, 7); g.fill();
  g.restore();
  txt(g, '×' + G.lives, 153, 35, 18, '#f3e7c9', 'left');
  drawCoin(g, 204, 34, G.t, G.t * 2.5);
  txt(g, '×' + G.coins, 219, 35, 18, '#f3e7c9', 'left');
  txt(g, String(G.score).padStart(6, '0'), 334, 35, 18, '#ffe28a', 'right');
  if (VW > 760) {
    txt(g, LEVELS[G.level].name, VW / 2, 26, 23, '#f3e7c9', 'center', DISPLAY, 400);
    drawRuneText(g, LEVELS[G.level].name, VW / 2, 42, 11, 'rgba(224,169,59,.9)', 1.6);
  }
}
function panel(g, x, y, w, h) {
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 30;
  g.fillStyle = lgrad(g, 0, y, 0, y + h, ['rgba(30,22,48,.95)', 'rgba(14,10,24,.96)']); rr(g, x, y, w, h, 16); g.fill();
  g.restore();
  g.strokeStyle = '#c9a045'; g.lineWidth = 2; rr(g, x, y, w, h, 16); g.stroke();
  g.strokeStyle = 'rgba(201,160,69,.3)'; g.lineWidth = 1; rr(g, x + 8, y + 8, w - 16, h - 16, 11); g.stroke();
  drawKnotBand(g, x + 50, y + 18, w - 100, 'rgba(201,160,69,.45)', 3.5);
  drawKnotBand(g, x + 50, y + h - 18, w - 100, 'rgba(201,160,69,.45)', 3.5);
  for (const [cx2, cy2] of [[x + 24, y + 24], [x + w - 24, y + 24], [x + 24, y + h - 24], [x + w - 24, y + h - 24]]) drawValknut(g, cx2, cy2, 16, 'rgba(201,160,69,.6)', 1.2);
}
function button(g, x, y, w, h, label, sel, fn) {
  if (sel) glow(g, x + w / 2, y + h / 2, w * .6, '255,170,90', .18);
  g.fillStyle = sel ? lgrad(g, 0, y, 0, y + h, ['#a8283a', '#6a1424']) : 'rgba(36,30,54,.92)'; rr(g, x, y, w, h, 12); g.fill();
  g.strokeStyle = sel ? '#ffd88a' : 'rgba(201,160,69,.6)'; g.lineWidth = 2; rr(g, x, y, w, h, 12); g.stroke();
  txt(g, label, x + w / 2, y + h / 2 + 1, 21, '#f6ecd4', 'center', BODY, 800, null);
  uiButtons.push({ x, y, w, h, fn });
}
function drawTitle(g) {
  g.fillStyle = lgrad(g, 0, 0, 0, VH, ['rgba(6,4,16,.55)', 'rgba(6,4,16,.15)', 'rgba(6,4,16,.6)']); g.fillRect(0, 0, VW, VH);
  const cx = VW / 2;
  glow(g, cx, 150, 260, '120,160,255', .12);
  drawRuneText(g, 'mjolnir', cx, 40, 30, 'rgba(224,180,90,.95)', 3);
  const pulse = 1 + Math.sin(G.t * 2) * .012;
  g.save(); g.translate(cx, 150); g.scale(pulse, pulse);
  g.shadowColor = 'rgba(140,190,255,.7)'; g.shadowBlur = 24;
  txt(g, 'MJÖLNIR', 0, 0, Math.min(96, VW / 8.5), '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 10);
  g.restore();
  txt(g, 'The Lost Hammer of Thor', cx, 214, 26, '#ffd88a', 'center', DISPLAY, 400, '#140a1e', 6);
  drawMjolnir(g, cx - Math.min(300, VW * .33), 160, 1.5, -.35, 1);
  drawValknut(g, cx + Math.min(300, VW * .33), 150, 70, 'rgba(224,180,90,.9)', 4);
  txt(g, 'Loki has stolen Mjölnir. Chase the trickster through five realms and take it back!', cx, 258, 19, '#efe3c8');
  const bw = 290, bh = 50;
  button(g, cx - bw / 2, 292, bw, bh, 'Begin the Quest', G.sel === 0, () => startGame(0));
  if (G.unlocked > 0) button(g, cx - bw / 2, 352, bw, bh, 'Continue: ' + LEVELS[G.unlocked].name, G.sel === 1, () => startGame(G.unlocked));
  const touchUI = document.body.classList.contains('touch');
  txt(g, touchUI ? 'Use the buttons at the bottom: ◀ ▶ to run, JUMP to leap, RUN to sprint.' : '← → / A D run  ·  SPACE / W jump  ·  SHIFT sprint  ·  P pause  ·  M sound', cx, VH - 70, 17, 'rgba(243,231,201,.9)');
  txt(g, 'Stomp wolves, ravens and draugar · bounce on sheep · read the runes before the lightning strikes', cx, VH - 44, 16, 'rgba(255,216,138,.85)');
}
function drawIntro(g) {
  const d = LEVELS[G.level], a = clamp(G.st * 3, 0, 1);
  g.save(); g.globalAlpha = a;
  const w = Math.min(660, VW - 40), h = 260, x = (VW - w) / 2, y = 115;
  panel(g, x, y, w, h);
  txt(g, `Realm ${['I', 'II', 'III', 'IV', 'V'][G.level]} of V`, VW / 2, y + 50, 18, '#c9a045', 'center', BODY, 800, null);
  txt(g, d.name, VW / 2, y + 94, 48, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  drawRuneText(g, d.name, VW / 2, y + 126, 16, 'rgba(224,180,90,.9)', 2);
  txt(g, d.sub, VW / 2, y + 162, 20, '#ffd88a', 'center', BODY, 800, null);
  g.font = `500 18px ${BODY}`;
  wrapText(g, d.intro, w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 196 + i * 22, 18, '#e3d6bc', 'center', BODY, 500, null));
  g.restore();
  if (G.st > .6) txt(g, 'Press JUMP to begin', VW / 2, y + h + 34, 18, `rgba(243,231,201,${.6 + Math.sin(G.t * 4) * .4})`);
}
function drawComplete(g) {
  const d = LEVELS[G.level], w = Math.min(620, VW - 40), h = 280, x = (VW - w) / 2, y = 105;
  panel(g, x, y, w, h);
  txt(g, 'Mjölnir slipped away!', VW / 2, y + 60, 36, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  g.font = `500 19px ${BODY}`;
  wrapText(g, d.next, w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 104 + i * 24, 19, '#e3d6bc', 'center', BODY, 500, null));
  txt(g, `${d.name} cleared`, VW / 2, y + 164, 20, '#c9a045', 'center', BODY, 800, null);
  txt(g, `Coins ${G.coins}   ·   Score ${G.score}`, VW / 2, y + 194, 20, '#ffd88a', 'center', BODY, 800, null);
  if (G.st > .8) button(g, VW / 2 - 130, y + h - 64, 260, 44, 'Chase Loki  →', true, () => { input.confirm = true; });
}
function drawGameOver(g) {
  g.fillStyle = 'rgba(6,4,12,.55)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(580, VW - 40), h = 240, x = (VW - w) / 2, y = 135;
  panel(g, x, y, w, h);
  txt(g, 'You have fallen', VW / 2, y + 62, 40, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  txt(g, 'The Valkyries carry you back to try again.', VW / 2, y + 112, 19, '#e3d6bc', 'center', BODY, 500, null);
  if (G.st > .8) button(g, VW / 2 - 130, y + h - 76, 260, 46, 'Rise again', true, () => { input.confirm = true; });
}
function drawVictory(g) {
  g.fillStyle = 'rgba(6,4,12,.45)'; g.fillRect(0, 0, VW, VH);
  const w = Math.min(660, VW - 40), h = 310, x = (VW - w) / 2, y = 85;
  panel(g, x, y, w, h);
  drawMjolnir(g, VW / 2, y + 80, 1.3, Math.sin(G.t * 2) * .1, 1);
  txt(g, 'Mjölnir is yours again!', VW / 2, y + 142, 38, '#f6ecd4', 'center', DISPLAY, 400, '#140a1e', 6);
  g.font = `500 18px ${BODY}`;
  wrapText(g, 'Loki slinks off to plot his next trick. Asgard is safe, and the thunder answers to Thor once more.', w - 90).forEach((l, i) => txt(g, l, VW / 2, y + 180 + i * 22, 18, '#e3d6bc', 'center', BODY, 500, null));
  txt(g, `Final score ${G.score}   ·   Coins ${G.coins}`, VW / 2, y + 232, 21, '#ffd88a', 'center', BODY, 800, null);
  if (G.st > 1.5) button(g, VW / 2 - 110, y + h - 62, 220, 46, 'Skál!', true, () => { input.confirm = true; });
}

function render() {
  uiButtons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07050d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawWorld(ctx);
  if (G.state === 'title') {
    ctx.save(); ctx.translate(VW * .16, VH - TS * 2 + 1); ctx.scale(1.6, 1.6); drawThor(ctx, 0, 0, { face: 1, t: G.t, run: 0, phase: 0, air: false }); ctx.restore();
    drawTitle(ctx);
  } else {
    drawHUD(ctx);
    if (G.state === 'intro') drawIntro(ctx);
    else if (G.state === 'complete') drawComplete(ctx);
    else if (G.state === 'gameover') drawGameOver(ctx);
    else if (G.state === 'victory') drawVictory(ctx);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(6,4,12,.6)'; ctx.fillRect(0, 0, VW, VH);
    txt(ctx, 'Paused', VW / 2, VH / 2 - 20, 48, '#f6ecd4', 'center', DISPLAY, 400);
    txt(ctx, 'Press P or tap to continue', VW / 2, VH / 2 + 30, 19, '#e3d6bc');
  }
  if (window.innerHeight > window.innerWidth * 1.1) {
    ctx.fillStyle = 'rgba(140,30,44,.92)'; rr(ctx, VW / 2 - 200, VH - 120, 400, 40, 10); ctx.fill();
    txt(ctx, 'Turn your phone sideways for a bigger view', VW / 2, VH - 100, 17, '#fff', 'center', BODY, 800, null);
  }
  ctx.restore();
}

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now(), acc = 0;
const DT = 1 / 120;
function frame(now) {
  let el = (now - last) / 1000; last = now;
  if (el > .1) el = .1;
  handleMenus();
  acc += el;
  while (acc >= DT) { step(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
loadLevel(0, false);
G.state = 'title';
requestAnimationFrame(frame);

// small hook for automated checks
window.__mjolnir = { G, input, get L() { return L; }, get P() { return P; }, beginLevel, startGame, LEVELS };
})();
</script>
