<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klapperkiste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b3138">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: Werkstatt-Wand oben (Hebebühne + Werte-Tafel), Teile-Regal als Leiste unten.
   Bewusst nur ein Look (dunkle Werkstatt), deshalb kein Hell/Dunkel-Wechsel. */
:root {
  color-scheme: dark;
  --wall: #1b3138;      /* Werkstattwand */
  --board: #12232a;     /* Tafeln, Regal */
  --chalk: #e9efe6;     /* Schrift */
  --chalk-dim: #9fb4b0;
  --mustard: #f2b632;   /* Aktion, Markierung */
  --rust: #e04b3a;      /* Fehler, Bremse */
  --mint: #6fd3a3;      /* fahrbereit */
  --line: #2c4a52;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--wall); color: var(--chalk);
  font-family: var(--font-body); font-weight: 600; font-size: 14px;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button {
  font: inherit; color: inherit; cursor: pointer; border: 0;
  border-radius: 10px; padding: 8px 14px; background: var(--line);
}
button:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.go { background: var(--mustard); color: var(--board); font-family: var(--font-display); font-size: 17px; letter-spacing: 0.02em; }

/* --- Werkstatt --- */
#shop { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--mustard); letter-spacing: 0.01em; }
#status { flex: 1; min-width: 0; margin: 0; font-size: 13px; color: var(--chalk-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.ok { color: var(--mint); }
.bar .actions { display: flex; gap: 8px; }

.bench { min-height: 0; display: grid; grid-template-columns: minmax(170px, 210px) 1fr; }
.stage { position: relative; min-width: 0; min-height: 0; }
#garage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

.panel {
  background: var(--board); border-radius: 0 14px 14px 0; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
}
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.04em; color: var(--chalk-dim); text-transform: uppercase; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 12px; }
.stats dt { color: var(--chalk-dim); }
.stats dd { margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 800; text-align: right; }
.meter { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 3px; }
.meter i { display: block; height: 100%; background: var(--mustard); transition: width 0.25s; }
.info { border-top: 2px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 12px; }
.info strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.info p { margin: 0; color: var(--chalk-dim); }
.info .nums { color: var(--chalk); font-variant-numeric: tabular-nums; }
.info button { justify-self: start; margin-top: 4px; padding: 5px 10px; font-size: 12px; background: var(--rust); }

.tray { background: var(--board); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs button { padding: 5px 12px; font-size: 12px; border-radius: 8px 8px 0 0; background: transparent; color: var(--chalk-dim); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--line); color: var(--chalk); }
.items {
  display: flex; gap: 8px; overflow-x: auto; background: var(--line);
  padding-block: 8px; touch-action: pan-x; scrollbar-width: thin;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  flex: 0 0 auto; width: 92px; display: grid; justify-items: center; gap: 2px; padding: 6px 4px;
  background: var(--board); border-radius: 10px; position: relative; touch-action: pan-x;
}
.card canvas { width: 72px; height: 50px; pointer-events: none; }
.card span { font-size: 11px; line-height: 1.15; text-align: center; text-wrap: balance; pointer-events: none; }
.card.in::after {
  content: "drin"; position: absolute; top: 4px; right: 4px; font-size: 9px; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase; background: var(--mint); color: var(--board);
  padding: 1px 4px; border-radius: 4px;
}

#ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; filter: drop-shadow(0 8px 6px rgba(0,0,0,0.45)); }

/* --- Probefahrt --- */
#drive { position: fixed; inset: 0; background: var(--wall); }
#road { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.hud {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px));
  display: grid; gap: 4px; background: rgba(18,35,42,0.82); border-radius: 12px; padding: 8px 12px; min-width: 150px;
}
.hud .speed { font-family: var(--font-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.hud .speed small { font-family: var(--font-body); font-size: 12px; color: var(--chalk-dim); }
.hud .fuel { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hud .fuel i { display: block; height: 100%; background: var(--mustard); }
.hud .row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
#btn-back { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); background: rgba(18,35,42,0.82); }
.pedal {
  position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%;
  font-family: var(--font-display); font-size: 18px; touch-action: none; box-shadow: 0 5px 0 rgba(0,0,0,0.35);
}
.pedal.down { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
#btn-brake { left: max(16px, env(safe-area-inset-left, 0px)); background: var(--rust); }
#btn-gas { right: max(16px, env(safe-area-inset-right, 0px)); background: var(--mint); color: var(--board); }
#result {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,24,29,0.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#result .box { background: var(--board); border-radius: 16px; padding: 18px 22px; max-width: 360px; display: grid; gap: 10px; text-align: center; }
#result h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; color: var(--mustard); text-wrap: balance; }
#result p { margin: 0; color: var(--chalk-dim); line-height: 1.4; }
#result .btns { display: flex; gap: 8px; justify-content: center; }

/* Hochformat: Werte-Tafel wandert unter die Bühne */
@media (orientation: portrait) {
  .bench { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .panel { order: 2; border-radius: 14px 14px 0 0; max-height: 34vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stats { grid-template-columns: repeat(3, auto 1fr); }
  .meter { display: none; }
  .bar h1 { font-size: 20px; flex: 1; }
  #status { order: 3; flex-basis: 100%; }
  .bar .actions button { padding: 6px 10px; font-size: 13px; }
}
@media (max-height: 360px) {
  .bar h1 { font-size: 20px; }
  .card { width: 82px; }
  .card canvas { height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .meter i { transition: none; }
}
</style>
</head>
<body>

<div id="shop">
  <header class="bar">
    <h1>Klapperkiste</h1>
    <p id="status" aria-live="polite"></p>
    <div class="actions">
      <button id="btn-clear" type="button">Alles ausbauen</button>
      <button id="btn-drive" class="go" type="button">Probefahrt</button>
    </div>
  </header>
  <main class="bench">
    <aside class="panel">
      <h2>Werte</h2>
      <dl class="stats" id="stats"></dl>
      <div class="info" id="info"></div>
    </aside>
    <div class="stage"><canvas id="garage" aria-label="Hebebühne mit deinem Auto"></canvas></div>
  </main>
  <nav class="tray" aria-label="Teile-Regal">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="items" id="items"></div>
  </nav>
</div>

<section id="drive" hidden>
  <canvas id="road" aria-label="Teststrecke"></canvas>
  <div class="hud">
    <div class="speed"><span id="hud-speed">0</span> <small>km/h</small></div>
    <div class="fuel"><i id="hud-fuel"></i></div>
    <div class="row"><span id="hud-fuel-label">Benzin</span><span id="hud-dist">0 / 680 m</span></div>
  </div>
  <button id="btn-back" type="button">Werkstatt</button>
  <button id="btn-brake" class="pedal" type="button">Bremse</button>
  <button id="btn-gas" class="pedal" type="button">Gas</button>
  <div id="result" hidden>
    <div class="box">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <div class="btns">
        <button id="btn-retry" type="button">Nochmal</button>
        <button id="btn-rebuild" class="go" type="button">Umbauen</button>
      </div>
    </div>
  </div>
</section>

<canvas id="ghost" hidden></canvas>

<script src="src/parts.js"></script>
<script src="src/car.js"></script>
<script src="src/track.js"></script>
<script src="src/art.js"></script>
<script src="src/garage.js"></script>
<script src="src/drive.js"></script>
<script src="src/main.js"></script>
</body>
</html>
