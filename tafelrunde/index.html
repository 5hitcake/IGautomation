<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tafelrunde</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; color: #f1e6d6;
    font-family: system-ui, sans-serif; touch-action: none; }
  #scene { position: fixed; inset: 0; display: block; }
  #dev { position: fixed; top: 4px; left: 4px; color: #0f0; font: 12px monospace; display: none; z-index: 50; }

  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: flex-start; padding: 10px 12px; pointer-events: none; z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #hud .party { display: flex; gap: 8px; flex-wrap: wrap; }
  .heroPill { background: rgba(36,26,18,.75); border-radius: 10px; padding: 4px 8px; font-size: 13px;
    border: 1px solid rgba(255,255,255,.15); }
  .heroPill.dead { opacity: .4; text-decoration: line-through; }
  .heroPill.turn { border-color: #ffd27a; box-shadow: 0 0 8px rgba(255,210,122,.6); }
  #turnInfo { background: rgba(36,26,18,.8); border-radius: 10px; padding: 6px 12px; font-size: 14px;
    border: 1px solid rgba(255,255,255,.15); max-width: 46vw; text-align: right; }

  #unitLayer { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .unitTag { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column;
    align-items: center; gap: 2px; white-space: nowrap; }
  .unitTag .hpbar { width: 46px; height: 6px; border-radius: 4px; background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.25); overflow: hidden; }
  .unitTag .hpfill { height: 100%; background: #4caf50; transition: width .25s ease; }
  .unitTag.enemy .hpfill { background: #d84b3a; }
  .unitTag .hpfill.low { background: #d84b3a; }
  .unitTag .moveTag { font-size: 10px; background: rgba(122,20,20,.85); color: #fff; padding: 1px 6px;
    border-radius: 8px; text-shadow: none; }
  .unitTag .shieldTag { font-size: 10px; background: rgba(70,120,200,.85); color: #fff; padding: 1px 5px;
    border-radius: 8px; }

  #cardsPanel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; pointer-events: none; }
  #cardsToggle { pointer-events: auto; background: rgba(36,26,18,.92); border: 1px solid rgba(255,255,255,.25);
    border-bottom: none; color: #f1e6d6; border-radius: 12px 12px 0 0; padding: 5px 26px; font-size: 13px;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cards { pointer-events: auto; width: 100%; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    max-height: 260px; overflow: hidden; box-sizing: border-box;
    padding: 10px calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-bottom));
    transition: max-height .25s ease, opacity .2s ease, padding .25s ease; }
  #cardsPanel.collapsed #cards { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
  .card { width: 96px; background: rgba(36,26,18,.9); border: 2px solid rgba(255,255,255,.2); border-radius: 12px;
    padding: 6px; text-align: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; background: #3a2c1c; }
  .card .name { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .card .hint { font-size: 9px; opacity: .8; line-height: 1.25; margin-top: 2px; }
  .card.disabled { opacity: .35; pointer-events: none; }
  .card.selected { border-color: #ffd27a; box-shadow: 0 0 10px rgba(255,210,122,.7); }
  #cancelTarget { position: fixed; bottom: 132px; left: 50%; transform: translateX(-50%); z-index: 11;
    background: #6b3a2a; color: #fff; border: none; border-radius: 20px; padding: 8px 18px; font-size: 13px;
    display: none; transition: bottom .25s ease; }
  #targetHint { position: fixed; bottom: 182px; left: 50%; transform: translateX(-50%); z-index: 11;
    background: rgba(36,26,18,.85); padding: 6px 14px; border-radius: 16px; font-size: 13px; display: none;
    text-align: center; max-width: 80vw; transition: bottom .25s ease; }
  body.cardsCollapsed #cancelTarget { bottom: 54px; }
  body.cardsCollapsed #targetHint { bottom: 104px; }

  #overlay { position: fixed; inset: 0; background: rgba(20,14,9,.92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 30; text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 22px; }
  #overlay p { margin: 0; opacity: .85; max-width: 340px; line-height: 1.4; }
  #inviteBox { display: flex; gap: 6px; align-items: center; }
  #inviteBox input { width: 220px; max-width: 60vw; padding: 8px; border-radius: 8px; border: 1px solid #665;
    background: #1c140d; color: #f1e6d6; }
  button.primary { background: #b5522f; color: #fff; border: none; border-radius: 24px; padding: 12px 28px;
    font-size: 15px; font-weight: 600; }
  #err { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: #7a2b2b; color: #fff;
    padding: 6px 14px; border-radius: 10px; font-size: 13px; z-index: 20; display: none; }
  #logPanel { position: fixed; top: 54px; left: 12px; z-index: 10; font-size: 11px; opacity: .7; max-width: 40vw;
    display: none; }
  @media (min-width: 700px) { #logPanel { display: block; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="dev"></div>
<div id="unitLayer"></div>

<div id="hud">
  <div class="party" id="party"></div>
  <div id="turnInfo"></div>
</div>
<div id="logPanel"></div>
<div id="err"></div>

<div id="targetHint"></div>
<button id="cancelTarget"></button>
<div id="cardsPanel">
  <div id="cardsToggle">▾</div>
  <div id="cards"></div>
</div>

<div id="overlay">
  <h1 id="overlayTitle">Tafelrunde</h1>
  <p id="overlayText"></p>
  <div id="inviteBox">
    <input id="link" readonly>
  </div>
  <button class="primary" id="startBtn"></button>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/GLTFLoader.js";
import { OrbitControls } from "./vendor/OrbitControls.js";
import { STR } from "./strings.js";

// ---------------- room / identity / websocket (per client-reference.md) ----------------
const params = new URLSearchParams(location.search);
let room = params.get("room");
if (!room) {
  room = Math.random().toString(36).slice(2, 8);
  params.set("room", room);
  history.replaceState(null, "", location.pathname + "?" + params);
}
document.getElementById("link").value = location.href;

let playerId = sessionStorage.getItem("mp-player-id");
if (!playerId) {
  playerId = "p-" + Math.random().toString(36).slice(2, 10);
  sessionStorage.setItem("mp-player-id", playerId);
}

const base = location.pathname.replace(/\/+$/, "");
const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws/" + room;

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");
const errEl = document.getElementById("err");
const turnInfo = document.getElementById("turnInfo");
const partyEl = document.getElementById("party");
const cardsEl = document.getElementById("cards");
const cancelBtn = document.getElementById("cancelTarget");
const targetHint = document.getElementById("targetHint");
const logPanel = document.getElementById("logPanel");
const unitLayer = document.getElementById("unitLayer");
const cardsPanel = document.getElementById("cardsPanel");
const cardsToggle = document.getElementById("cardsToggle");

overlayTitle.textContent = STR.title;
overlayText.textContent = STR.waitingHint;
startBtn.textContent = STR.startBtn;
cancelBtn.textContent = STR.cancelTarget;

// ---------------- poker-style collapsible hand ----------------
let cardsCollapsed = false;
let autoCollapsed = false; // true if we collapsed the tray ourselves while picking a target
function setCardsCollapsed(v) {
  cardsCollapsed = v;
  cardsPanel.classList.toggle("collapsed", cardsCollapsed);
  document.body.classList.toggle("cardsCollapsed", cardsCollapsed);
  cardsToggle.textContent = cardsCollapsed ? "▲" : "▼";
}
cardsToggle.onclick = () => setCardsCollapsed(!cardsCollapsed);

let ws, joined = false;

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { errEl.style.display = "none"; if (joined) send({ type: "join", playerId }); };
  ws.onclose = () => { overlayText.textContent = STR.disconnected; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "error") { errEl.textContent = msg.error; errEl.style.display = "block"; return; }
    if (msg.type !== "state") return;
    errEl.style.display = "none";
    onState(msg);
  };
}
connect();

startBtn.onclick = () => {
  joined = true;
  overlay.classList.add("hidden");
  send({ type: "join", playerId });
};
document.getElementById("link").onclick = (e) => { e.target.select(); };

// ---------------- hex math (client-side mirror, used only for highlighting) ----------------
const SIZE = 1.7;
function hexToWorld(q, r) { return { x: SIZE * 1.5 * q, z: SIZE * Math.sqrt(3) * (r + q / 2) }; }
function hexDist(a, b) { return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2; }
const DIRS = [{ q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 }, { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }];
function neighbors(q, r) { return DIRS.map(d => ({ q: q + d.q, r: r + d.r })); }
function inBounds(q, r, radius) { return Math.abs(q) <= radius && Math.abs(r) <= radius && Math.abs(q + r) <= radius; }
function occupantAt(state, q, r) {
  for (const h of state.heroes) if (h.hp > 0 && h.q === q && h.r === r) return { kind: "hero", unit: h };
  for (const e of state.enemies) if (e.active && e.hp > 0 && e.q === q && e.r === r) return { kind: "enemy", unit: e };
  return null;
}
function obstacleAt(state, q, r) { return state.board.obstacles.some(o => o.q === q && o.r === r); }
function reachableMove(state, from, range) {
  const seen = new Map(); seen.set(from.q + "," + from.r, 0);
  let frontier = [from];
  for (let step = 1; step <= range; step++) {
    const next = [];
    for (const cell of frontier) for (const n of neighbors(cell.q, cell.r)) {
      const k = n.q + "," + n.r;
      if (seen.has(k) || !inBounds(n.q, n.r, state.board.radius) || obstacleAt(state, n.q, n.r) || occupantAt(state, n.q, n.r)) continue;
      seen.set(k, step); next.push(n);
    }
    frontier = next;
  }
  return seen;
}

// ---------------- Three.js scene ----------------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const DPR_CAP = 1.5;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, DPR_CAP));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2016);
scene.fog = new THREE.Fog(0x2a2016, 30, 70);

const FRUSTUM = 20;
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(-FRUSTUM * aspect, FRUSTUM * aspect, FRUSTUM, -FRUSTUM, 0.1, 200);
camera.position.set(16, 20, 16);
camera.lookAt(0, 0, 0);

// rotate (drag) + zoom (wheel/pinch) so the whole board can be brought into view and inspected from any angle
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.8;
controls.minZoom = 0.5;
controls.maxZoom = 2.5;
controls.minPolarAngle = 0.3;
controls.maxPolarAngle = 1.3;
controls.update();

const ambient = new THREE.AmbientLight(0xffe4c2, 0.65);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffd9a0, 1.1);
sun.position.set(12, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
scene.add(sun);

function resize() {
  aspect = innerWidth / innerHeight;
  camera.left = -FRUSTUM * aspect; camera.right = FRUSTUM * aspect;
  camera.top = FRUSTUM; camera.bottom = -FRUSTUM;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize); addEventListener("orientationchange", resize); resize();

function worldToScreen(x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight };
}

// ---------------- asset loading ----------------
const gltfLoader = new GLTFLoader();
const modelCache = {};
async function loadModel(id) {
  if (modelCache[id]) return modelCache[id];
  const gltf = await gltfLoader.loadAsync(`./assets/models/${id}.glb`);
  modelCache[id] = gltf.scene;
  return gltf.scene;
}
const texLoader = new THREE.TextureLoader();
const groundTex = texLoader.load("./assets/tex_ground.jpg");
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.colorSpace = THREE.SRGBColorSpace;
const spriteTexCache = {};
function loadSpriteTex(id) {
  if (!spriteTexCache[id]) {
    const t = texLoader.load(`./assets/sprites/${id}.png`);
    t.colorSpace = THREE.SRGBColorSpace;
    spriteTexCache[id] = t;
  }
  return spriteTexCache[id];
}

const tileGeo = new THREE.CylinderGeometry(SIZE, SIZE, 0.35, 6);
const tileMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 });
const boardGroup = new THREE.Group();
scene.add(boardGroup);

function buildBoard(state) {
  boardGroup.clear();
  const r = state.board.radius;
  for (let q = -r; q <= r; q++) {
    for (let rr = -r; rr <= r; rr++) {
      if (!inBounds(q, rr, r)) continue;
      const w = hexToWorld(q, rr);
      const tile = new THREE.Mesh(tileGeo, tileMat);
      tile.position.set(w.x, -0.18, w.z);
      tile.receiveShadow = true;
      tile.userData = { q, r: rr, isTile: true };
      boardGroup.add(tile);
    }
  }
  for (const o of state.board.obstacles) {
    loadModel(o.type === "rock" ? "prop_rock" : "prop_tree").then(proto => {
      const m = proto.clone();
      const w = hexToWorld(o.q, o.r);
      m.position.set(w.x, 0, w.z);
      m.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
      boardGroup.add(m);
    }).catch(() => {});
  }
}

// highlight discs for valid targets
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.55 });
const highlightGeo = new THREE.CylinderGeometry(SIZE * 0.85, SIZE * 0.85, 0.05, 6);
let highlightMeshes = [];
function clearHighlights() { for (const m of highlightMeshes) scene.remove(m); highlightMeshes = []; }
function showHighlights(hexList) {
  clearHighlights();
  for (const h of hexList) {
    const w = hexToWorld(h.q, h.r);
    const m = new THREE.Mesh(highlightGeo, highlightMat);
    m.position.set(w.x, 0.02, w.z);
    m.userData = { q: h.q, r: h.r, isHighlight: true };
    scene.add(m); highlightMeshes.push(m);
  }
}

// ---------------- units: 2D comic sprites billboarded over the 3D board ----------------
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.38, depthWrite: false });
const shadowGeo = new THREE.CircleGeometry(0.85, 20);
const ownRingGeo = new THREE.RingGeometry(1.05, 1.28, 24);
const ownRingMat = new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false });

const units = new Map();
const HERO_SPRITE = { waechter: "hero_waechter", wildhueter: "hero_wildhueter" };
const ENEMY_SPRITE = { raider: "enemy_pluenderer", archer: "enemy_bogenschuetze", captain: "enemy_hauptmann" };
const SPRITE_H = { hero: 2.1, raider: 1.7, archer: 1.6, captain: 2.5 };

function ensureUnit(uid, spriteId, kind, sizeKey, isOwn) {
  let u = units.get(uid);
  if (u) {
    if (u.removed) {
      scene.add(u.obj); u.removed = false; u.dead = false; u.deathT = 0;
      u.hitFlash = 0; u.lungeT = 0; u.swingT = 0;
      u.obj.scale.set(1, 1, 1);
      u.sprite.material.color.setRGB(1, 1, 1);
    }
    return u;
  }
  const tex = loadSpriteTex(spriteId);
  const h = SPRITE_H[sizeKey] || 1.8;
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(h * 0.8, h, 1);
  sprite.center.set(0.5, 0); // anchor at sprite's bottom edge, so position.y=0 sits on the ground

  const group = new THREE.Group();
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  group.add(shadow);
  if (isOwn) {
    const ring = new THREE.Mesh(ownRingGeo, ownRingMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.015;
    group.add(ring);
  }
  group.add(sprite);
  scene.add(group);

  const tag = document.createElement("div");
  tag.className = "unitTag" + (kind === "enemy" ? " enemy" : "");
  tag.innerHTML = `<div class="moveTag" style="display:none"></div><div class="hpbar"><div class="hpfill"></div></div><div class="shieldTag" style="display:none"></div>`;
  unitLayer.appendChild(tag);

  u = {
    obj: group, sprite, kind, spriteH: h, animT: Math.random() * 10, hitFlash: 0, lastHp: null, dead: false, tag,
    lungeT: 0, lungeDur: 0.3, lungeDirX: 0, lungeDirZ: 0,
    swingT: 0, swingDur: 0.3, swingDelay: 0, swingDir: 1,
  };
  units.set(uid, u);
  return u;
}

// attack lunge: a quick dash toward a world position and back, for the unit performing the strike
function triggerLunge(u, targetX, targetZ) {
  if (!u || u.baseX === undefined) return;
  const dx = targetX - u.baseX, dz = targetZ - u.baseZ;
  const len = Math.hypot(dx, dz) || 1;
  u.lungeDirX = dx / len; u.lungeDirZ = dz / len;
  u.lungeDur = 0.26 + Math.random() * 0.08;
  u.lungeT = u.lungeDur;
}
// swing: an in-place weapon-swing gesture (rotation + squash), used when we only know a unit acted, not exactly at whom
function triggerSwing(u, delay) {
  if (!u) return;
  u.swingDir = Math.random() < 0.5 ? -1 : 1;
  u.swingDur = 0.3 + Math.random() * 0.18;
  u.swingT = u.swingDur;
  u.swingDelay = delay || 0;
}
function triggerHit(u) {
  if (!u) return;
  u.hitFlash = 0.32 + Math.random() * 0.12;
}

function syncUnits(state, you) {
  const seen = new Set();
  for (const h of state.heroes) {
    const uid = "hero:" + h.playerId;
    seen.add(uid);
    const u = ensureUnit(uid, HERO_SPRITE[h.cls], "hero", "hero", h.playerId === you);
    const w = hexToWorld(h.q, h.r);
    if (u.baseX === undefined) { u.baseX = w.x; u.baseZ = w.z; u.obj.position.set(w.x, 0, w.z); }
    u.targetX = w.x; u.targetZ = w.z;
    if (u.lastHp !== null && h.hp < u.lastHp) triggerHit(u);
    u.dead = h.hp <= 0;
    u.lastHp = h.hp; u.hp = h.hp; u.maxHp = h.maxHp; u.shield = h.shield; u.moveTagText = null;
  }
  for (const e of state.enemies) {
    if (!e.active) continue;
    const uid = "enemy:" + e.id;
    seen.add(uid);
    const u = ensureUnit(uid, ENEMY_SPRITE[e.type], "enemy", e.type, false);
    const w = hexToWorld(e.q, e.r);
    if (u.baseX === undefined) { u.baseX = w.x; u.baseZ = w.z; u.obj.position.set(w.x, 0, w.z); }
    u.targetX = w.x; u.targetZ = w.z;
    if (u.lastHp !== null && e.hp < u.lastHp) triggerHit(u);
    u.dead = e.hp <= 0;
    u.lastHp = e.hp; u.hp = e.hp; u.maxHp = e.maxHp; u.shield = 0;
    u.moveTagText = (state.phase === "hero" && e.plannedMove) ? STR.enemyMoves[e.plannedMove] : null;
  }
  for (const [uid, u] of units) {
    if (!seen.has(uid) && !u.removed) { u.dead = true; }
    if (!seen.has(uid)) { u.tag.style.display = "none"; }
  }
}

function updateUnitTags() {
  for (const [uid, u] of units) {
    if (u.removed) { u.tag.style.display = "none"; continue; }
    const topY = u.obj.position.y + u.spriteH + 0.35;
    const p = worldToScreen(u.obj.position.x, topY, u.obj.position.z);
    u.tag.style.display = "flex";
    u.tag.style.left = p.x + "px";
    u.tag.style.top = p.y + "px";
    const frac = u.maxHp ? Math.max(0, u.hp / u.maxHp) : 0;
    const fill = u.tag.querySelector(".hpfill");
    fill.style.width = Math.round(frac * 100) + "%";
    fill.classList.toggle("low", frac <= 0.3);
    const moveEl = u.tag.querySelector(".moveTag");
    if (u.moveTagText) { moveEl.style.display = "inline-block"; moveEl.textContent = u.moveTagText; }
    else moveEl.style.display = "none";
    const shieldEl = u.tag.querySelector(".shieldTag");
    if (u.shield) { shieldEl.style.display = "inline-block"; shieldEl.textContent = "🛡" + u.shield; }
    else shieldEl.style.display = "none";
  }
}

// ---------------- pointer input ----------------
// The canvas now also drives OrbitControls (drag to rotate, wheel/pinch to zoom), so a hex
// pick must only fire on a genuine TAP (down+up close together), never on a rotate/zoom drag.
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pendingCard = null;
let pendingStepType = null;
let validTargets = [];
let pointerDownInfo = null;

function pointerToNDC(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

canvas.addEventListener("pointerdown", (e) => {
  pointerDownInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
});
canvas.addEventListener("pointerup", (e) => {
  const down = pointerDownInfo;
  pointerDownInfo = null;
  if (!down || !pendingCard) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const held = performance.now() - down.t;
  if (moved > 14 || held > 550) return; // was a camera rotate/zoom drag, not a tap
  pointerToNDC(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !obj.userData.isTile && !obj.userData.isHighlight) obj = obj.parent;
    if (obj && (obj.userData.isTile || obj.userData.isHighlight)) {
      tryTarget(obj.userData.q, obj.userData.r);
      return;
    }
  }
});

function tryTarget(q, r) {
  const inRange = validTargets.some(t => t.q === q && t.r === r);
  if (!inRange) return;
  if (pendingStepType === "attack") {
    const mine = units.get("hero:" + playerId);
    const w = hexToWorld(q, r);
    triggerLunge(mine, w.x, w.z);
  }
  send({ type: "action", action: { cardId: pendingCard, q, r } });
  clearHighlights();
  targetHint.style.display = "none";
}

function clearPending() {
  pendingCard = null; pendingStepType = null; validTargets = [];
  clearHighlights();
  cancelBtn.style.display = "none";
  targetHint.style.display = "none";
  document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
  if (autoCollapsed) { autoCollapsed = false; setCardsCollapsed(false); }
}
cancelBtn.onclick = clearPending;

// ---------------- render loop ----------------
const STEP = 1000 / 60;
let acc = 0, last = performance.now();
const dev = new URLSearchParams(location.search).has("dev");
if (dev) document.getElementById("dev").style.display = "block";

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - last, 100); last = now; acc += dt;
  while (acc >= STEP) { tick(STEP / 1000); acc -= STEP; }
  renderer.render(scene, camera);
  updateUnitTags();
}
function tick(dtSec) {
  controls.update();
  for (const [uid, u] of units) {
    u.animT += dtSec;

    // base position eases toward the latest hex; lunge/lungeDir add a temporary dash on top
    if (u.targetX !== undefined) {
      u.baseX += (u.targetX - u.baseX) * Math.min(1, dtSec * 6);
      u.baseZ += (u.targetZ - u.baseZ) * Math.min(1, dtSec * 6);
    }
    let lungeOffX = 0, lungeOffZ = 0;
    if (u.lungeT > 0) {
      u.lungeT = Math.max(0, u.lungeT - dtSec);
      const p = u.lungeT / u.lungeDur;
      const k = Math.sin((1 - p) * Math.PI); // 0 -> 1 -> 0
      lungeOffX = u.lungeDirX * k * 0.45;
      lungeOffZ = u.lungeDirZ * k * 0.45;
    }

    // in-place swing gesture (weapon swing / recoil), independent of the lunge dash
    let swingRot = 0, swingScale = 1;
    if (u.swingDelay > 0) {
      u.swingDelay -= dtSec;
    } else if (u.swingT > 0) {
      u.swingT = Math.max(0, u.swingT - dtSec);
      const p = u.swingT / u.swingDur;
      const k = Math.sin((1 - p) * Math.PI);
      swingRot = u.swingDir * k * 0.4;
      swingScale = 1 + k * 0.12;
    }

    const bob = u.dead ? 0 : Math.sin(u.animT * 2.2) * 0.06;
    let scale = 1;
    if (u.dead) {
      u.deathT = (u.deathT || 0) + dtSec;
      scale = Math.max(0, 1 - u.deathT / 0.6);
      if (scale <= 0.02 && !u.removed) { scene.remove(u.obj); u.removed = true; }
      u.sprite.material.color.setRGB(1, 1, 1);
    } else if (u.hitFlash > 0) {
      u.hitFlash -= dtSec;
      scale = 1 + Math.sin(u.hitFlash * 40) * 0.08;
      const t = Math.max(0, u.hitFlash / 0.35);
      u.sprite.material.color.setRGB(1, 1 - 0.55 * t, 1 - 0.55 * t);
    } else {
      u.sprite.material.color.setRGB(1, 1, 1);
    }
    scale *= swingScale;

    u.obj.position.x = u.baseX + lungeOffX;
    u.obj.position.z = u.baseZ + lungeOffZ;
    u.obj.position.y = bob;
    u.obj.scale.set(Math.max(0.001, scale), Math.max(0.001, scale), 1);
    u.sprite.material.rotation = swingRot;
  }
}
requestAnimationFrame(frame);

// ---------------- cards: id -> steps (mirrors logic.js CARDS, for highlighting + labels only) ----------------
const CARD_DEFS = {
  waechter: [
    { id: "ansturm", art: "card_waechter_ansturm", steps: [{ type: "move", range: 2 }, { type: "attack", range: 1 }] },
    { id: "schildhieb", art: "card_waechter_schildhieb", steps: [{ type: "attack", range: 1 }, { type: "shield" }] },
    { id: "rueckzug", art: "card_waechter_rueckzug", steps: [{ type: "attack", range: 1 }, { type: "move", range: 1 }] },
  ],
  wildhueter: [
    { id: "sprungschuss", art: "card_wildhueter_sprungschuss", steps: [{ type: "move", range: 2 }, { type: "attack", range: 2 }] },
    { id: "sicherung", art: "card_wildhueter_sicherung", steps: [{ type: "attack", range: 2 }, { type: "shield" }] },
    { id: "explosivpfeil", art: "card_wildhueter_explosivpfeil", steps: [{ type: "attack", range: 2 }, { type: "splashFromLast" }] },
  ],
};

// ---------------- state -> UI ----------------
let lastRound = null;
function onState(msg) {
  const s = msg.view;
  if (msg.status === "waiting") {
    overlay.classList.remove("hidden");
    overlayText.textContent = STR.waitingHint;
    return;
  }
  overlay.classList.add("hidden");
  if (!s) return;
  if (!boardGroup.children.length) buildBoard(s);
  syncUnits(s, msg.you);
  // a round just advanced -> the whole enemy phase resolved in one jump server-side (Tier-1 kernel
  // returns one final state, not a step-by-step feed), so give every surviving enemy a quick,
  // lightly-staggered "acted" swing gesture rather than claiming precise per-attack attribution.
  if (lastRound !== null && s.round !== lastRound && msg.status === "playing") {
    let i = 0;
    for (const e of s.enemies) {
      if (!e.active || e.hp <= 0) continue;
      triggerSwing(units.get("enemy:" + e.id), (i++) * 0.08 + Math.random() * 0.08);
    }
  }
  lastRound = s.round;
  renderHud(msg, s);
  renderCards(msg, s);
  renderLog(s);
  if (msg.status === "over") renderGameOver(msg);
}

function renderHud(msg, s) {
  const myTurn = isMyTurn(msg, s);
  const myHero = s.heroes.find(h => h.playerId === msg.you);
  let label;
  if (s.phase === "enemy") label = STR.enemyPhase;
  else if (myTurn) label = (myHero && myHero.cardStep) ? STR.yourTurnStep2 : STR.yourTurn;
  else label = STR.waitingForTurn(heroLabel(s.heroes[s.activeHeroIdx]));
  turnInfo.textContent = STR.roundLabel(s.round) + " · " + label;
  partyEl.innerHTML = "";
  s.heroes.forEach((h, i) => {
    const pill = document.createElement("div");
    pill.className = "heroPill" + (h.hp <= 0 ? " dead" : "") + (i === s.activeHeroIdx && s.phase === "hero" ? " turn" : "");
    pill.textContent = `${STR.heroNames[h.cls]}: ${h.hp}/${h.maxHp} ${STR.hpLabel}` + (h.shield ? ` (+${h.shield})` : "");
    partyEl.appendChild(pill);
  });
}
function heroLabel(h) { return h ? STR.heroNames[h.cls] : ""; }
function isMyTurn(msg, s) {
  return msg.status === "playing" && s.phase === "hero" && s.heroes[s.activeHeroIdx] && s.heroes[s.activeHeroIdx].playerId === msg.you;
}

function renderCards(msg, s) {
  const myHero = s.heroes.find(h => h.playerId === msg.you);
  cardsEl.innerHTML = "";
  if (!myHero) { clearPending(); return; }
  const myTurn = isMyTurn(msg, s) && myHero.hp > 0 && !myHero.acted;
  if (!myTurn) { clearPending(); }
  const defs = CARD_DEFS[myHero.cls];
  for (const def of defs) {
    const info = STR.cards[def.id];
    const committed = myHero.cardStep && myHero.cardStep.cardId === def.id;
    const clickable = myTurn && (!myHero.cardStep || committed);
    const el = document.createElement("div");
    el.className = "card" + (clickable ? "" : " disabled") + (committed ? " selected" : "");
    el.innerHTML = `<img src="./assets/ui/${def.art}.png" alt=""><div class="name">${info.name}</div><div class="hint">${info.hint}</div>`;
    if (clickable && !committed) el.onclick = () => startCard(def, myHero, s);
    cardsEl.appendChild(el);
  }
  if (myTurn && myHero.cardStep) {
    const def = defs.find(d => d.id === myHero.cardStep.cardId);
    const step = def.steps[myHero.cardStep.stepIndex];
    activateStep(def.id, step, myHero, s, myHero.cardStep.stepIndex + 1);
  } else {
    clearPending();
  }
}

function startCard(def, hero, s) {
  activateStep(def.id, def.steps[0], hero, s, 1);
}

function activateStep(cardId, step, hero, s, stepNumber) {
  pendingCard = cardId;
  pendingStepType = step.type;
  let targets = [];
  let hint = "";
  if (step.type === "move") {
    const r = reachableMove(s, hero, step.range);
    for (const [k] of r) { if (k === hero.q + "," + hero.r) continue; const [q, rr] = k.split(",").map(Number); targets.push({ q, r: rr }); }
    hint = STR.stepPickMove.replace("{n}", stepNumber);
  } else if (step.type === "attack") {
    for (const e of s.enemies) if (e.active && e.hp > 0 && hexDist(hero, e) <= step.range) targets.push({ q: e.q, r: e.r });
    hint = STR.stepPickAttack.replace("{n}", stepNumber);
  } else {
    // shield / splashFromLast resolve automatically server-side, never reach here
    return;
  }
  validTargets = targets;
  showHighlights(targets);
  targetHint.style.display = "block";
  targetHint.textContent = hint;
  cancelBtn.style.display = stepNumber === 1 ? "block" : "none";
  if (!cardsCollapsed) { autoCollapsed = true; setCardsCollapsed(true); } // free up the board while picking a target
}

function renderLog(s) {
  logPanel.innerHTML = STR.logLabel + ":<br>" + s.log.slice(-6).map(l => "· " + l).join("<br>");
}

function renderGameOver(msg) {
  overlay.classList.remove("hidden");
  const won = msg.result && msg.result.outcome === "win";
  overlayTitle.textContent = won ? STR.win : STR.lose;
  overlayText.textContent = "";
  startBtn.textContent = STR.playAgain;
  startBtn.onclick = () => { send({ type: "reset" }); overlay.classList.add("hidden"); };
}
</script>
