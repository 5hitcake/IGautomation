<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8f2">
  <title>Wolki: Sky Climber</title>
  <style>
    /* Das Spiel hat bewusst nur einen Look (Himmel), unabhängig vom System-Theme. */
    :root { --bg: #7ec8f2; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; touch-action: none; }
    /* Android 15+ zeichnet randlos: die App reicht unter Statusleiste und Kamera-Aussparung.
       Capacitor meldet deren Größe als --safe-area-inset-*, dort bleibt nur Himmel zu sehen. */
    #game { position: fixed; display: flex; align-items: center; justify-content: center;
      top: var(--safe-area-inset-top, 0px); bottom: var(--safe-area-inset-bottom, 0px);
      left: var(--safe-area-inset-left, 0px); right: var(--safe-area-inset-right, 0px); }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/boot.js"></script>
</body>
</html>
