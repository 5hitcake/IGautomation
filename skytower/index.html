<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8f2">
  <title>Wolki: Sky Climber</title>
  <style>
    /* Das Spiel hat bewusst nur einen Look (Himmel), unabhängig vom System-Theme. */
    :root { --bg: #7ec8f2; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; touch-action: none; }
    #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
